}
function leftText(p) {
  if (p.status === 'squad') return '<span class="tag">At club</span>';
  if (p.status === 'loan') return `<span class="tag warn">On loan · ${esc(clubName(p.loan.club))}</span>`;
  const l = p.left;
  if (l.how === 'Sold') return `Sold to ${esc(clubName(l.club))} · ${money(l.fee)}, ${l.season}`;
  return `${l.how}, ${l.season}`;
}

  });
}

/* ---------------- best XI ---------------- */
// The season's best XI in a formation: rated on average match rating and appearances,
// preferring players who actually played that position that season.
function bestXI(Y, key) {
  const rows = Object.values(S.players).map(p => ({ p, r: p.seasons.find(x => x.season === Y && x.club === NU && !x.loan) })).filter(x => x.r && x.r.apps >= 3);
  const byId = new Map(rows.map(x => [x.p.id, x.r]));
  const val = (p, t) => {
    if ((t === 'GK') !== (p.pos === 'GK')) return -50;
    const r = byId.get(p.id), played = (r.posPlayed && r.posPlayed[t]) || 0;
    const fitB = played >= 5 ? 0.35 : posList(p).includes(t) ? 0.15 : played > 0 ? 0 : -0.3 - 2.5 * (1 - fitP(p, t));
    return (r.avg ?? 6.2) + 0.015 * Math.min(r.apps, 50) + 0.01 * (r.goals + r.assists) + fitB;
  };
  return assignSlots(rows.map(x => x.p), formOf(key).slots.map(x => x[0]), val).xi.map(x => ({ ...x, r: byId.get(x.p.id) }));
}
/* Pitch: one circle per slot, coloured by unit, with a rating inside and the name below.
   entries: [{ idx, p, num, sub, cls }]; mode 'big' | 'mini' | 'plan' (plan = clickable slots). */
function pitchHtml(entries, key, mode = 'big') {
  const slots = formOf(key).slots, mini = mode === 'mini';
  const lastCount = {}; entries.forEach(x => lastCount[x.p.last] = (lastCount[x.p.last] || 0) + 1);
  const nm = p => lastCount[p.last] > 1 ? `${p.first[0]}. ${p.last}` : p.last;
  const one = x => {
    const [, l, px, py] = slots[x.idx];
    const inner = `${mini ? '' : `<span class="lab">${l}</span>`}<span class="dot">${x.num ?? ''}</span><span class="nm">${esc(nm(x.p))}</span>${!mini && x.sub ? `<span class="st">${x.sub}</span>` : ''}`;
    const cls = `pp ${labelGroup(l)} ${x.cls || ''}`, style = `left:${px}%;top:${py}%`;
    return mode === 'plan'
      ? `<button class="${cls} clickable" style="${style}" data-action="plan-slot" data-v="${x.idx}" aria-label="${l}: ${esc(fullName(x.p))}, rated ${x.num}. Change player">${inner}</button>`
      : `<div class="${cls}" style="${style}">${inner}</div>`;
  };
  return `<div class="pitch ${mini ? 'mini' : ''}"><div class="pl-box top"></div><div class="pl-box bottom"></div><div class="pl-half"></div><div class="pl-circle"></div>${entries.map(one).join('')}</div>`;
}
const unitKey = `<div class="keyrow"><span><i style="background:var(--c-gk)"></i>Goalkeeper</span><span><i style="background:var(--c-def)"></i>Defence</span><span><i style="background:var(--c-mid)"></i>Midfield</span><span><i style="background:var(--c-att)"></i>Attack</span></div>`;
const effAt = (p, t) => p.ovr * fitP(p, t);

/* Position report for a squad in a formation: the planned starter(s) at each position, how they
   compare with the XI average, who else can play there, and whether the position needs a signing. */
function positionReport(list, key) {
  const { xi } = planXI(list, key);
  const avg = xi.reduce((a, x) => a + x.eff, 0) / Math.max(1, xi.length);
  const counts = {}; formTypes(key).forEach(t => counts[t] = (counts[t] || 0) + 1);
  const rows = POS_ORDER.map(t => {
    const able = list.filter(p => posList(p).includes(t)).sort((a, b) => effAt(b, t) - effAt(a, t));
    const starters = xi.filter(x => x.slot === t);
    const startEff = starters.length ? Math.min(...starters.map(x => x.eff)) : (able[0] ? effAt(able[0], t) : 0);
    const used = counts[t] || 0, gap = startEff - avg;
    let status = !used ? 'Not used' : gap >= 2 ? 'Strong' : gap >= -2 ? 'Solid' : gap >= -5 ? 'Below par' : 'Weak spot';
    const thin = used && able.length < used + 1;
    return { t, used, able, starters, startEff, gap, status, thin };
  });
  return { xi, avg, rows };
}
const STATUS_TAG = { 'Strong': 'tag', 'Solid': 'tag', 'Below par': 'tag warn', 'Weak spot': 'tag err', 'Not used': 'tag' };

/* ---------------- league position chart ---------------- */
const DIV_SIZE = { PL: 20, CH: 24, L1: 24, L2: 24, NL: 24 };
function drawPosChart() {
  const host = document.getElementById('poschart'); if (!host || !S.history.length) return;
  const H = S.history, n = H.length;
  const W = Math.max(300, host.clientWidth), HT = W < 500 ? 240 : 300;
  const m = { l: 34, r: 40, t: 10, b: 28 }, iw = W - m.l - m.r, ih = HT - m.t - m.b;
  const lowest = Math.max(...H.map(h => LEAGUE_CODES.indexOf(h.div)));
  const bands = LEAGUE_CODES.slice(0, lowest + 1);
  const yMax = PYRAMID_OFFSET[bands[bands.length - 1]] + DIV_SIZE[bands[bands.length - 1]];
  const y = v => m.t + ((v - 0.5) / yMax) * ih;
  const x = i => n === 1 ? m.l + iw / 2 : m.l + (i * iw) / (n - 1);
  const val = h => PYRAMID_OFFSET[h.div] + h.pos;
  let svg = '';
  bands.forEach((d, i) => {
    const top = y(PYRAMID_OFFSET[d] + 0.5), bot = y(PYRAMID_OFFSET[d] + DIV_SIZE[d] + 0.5);
    if (i % 2 === 0) svg += `<rect x="${m.l}" y="${top}" width="${iw}" height="${bot - top}" fill="var(--band)"/>`;
    svg += `<line x1="${m.l}" x2="${m.l + iw}" y1="${bot}" y2="${bot}" stroke="var(--border)"/>`;
    svg += `<text class="bandlbl" x="${m.l + 6}" y="${top + 13}">${DIV_NAME[d]}</text>`;
    if (d === 'PL') [[4.5, 'Champions League places'], [17.5, 'Relegation']].forEach(([v, l]) => {
      svg += `<line x1="${m.l}" x2="${m.l + iw}" y1="${y(v)}" y2="${y(v)}" stroke="var(--muted)" stroke-opacity=".45" stroke-dasharray="2 4"/><text x="${m.l + iw - 4}" y="${y(v) - 4}" text-anchor="end" style="font-size:10px">${l}</text>`;
    });
    const ticks = d === 'PL' ? [1, 10, 20] : [1, 12, 24];
    ticks.forEach(t => { svg += `<text x="${m.l - 6}" y="${y(PYRAMID_OFFSET[d] + t) + 4}" text-anchor="end">${t}</text>`; });
  });
  const step = Math.max(1, Math.ceil(n / Math.max(1, Math.floor(iw / 52))));
  H.forEach((h, i) => { if (i % step === 0 || i === n - 1) svg += `<text x="${x(i)}" y="${HT - 8}" text-anchor="middle">${h.label.slice(2)}</text>`; });
  const pts = H.map((h, i) => [x(i), y(val(h))]);
  if (n > 1) svg += `<path d="${pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--series)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  H.forEach((h, i) => { const g = h.trophies.length > 0; svg += `<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="${g ? 6 : 4.5}" fill="${g ? 'var(--gold)' : 'var(--series)'}" stroke="var(--surface)" stroke-width="2"/>`; });
  const last = H[n - 1];
  svg += `<text x="${pts[n - 1][0] + 9}" y="${pts[n - 1][1] + 4}" style="fill:var(--text);font-weight:700">${ordinal(last.pos)}</text>`;
  svg += `<line id="pc-cross" x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/>`;
  svg += `<rect id="pc-hit" x="${m.l - 10}" y="${m.t}" width="${iw + 20}" height="${ih}" fill="transparent"/>`;
  host.innerHTML = `<svg width="${W}" height="${HT}" viewBox="0 0 ${W} ${HT}">${svg}</svg><div class="charttip" id="pc-tip" hidden></div>`;
  const hit = host.querySelector('#pc-hit'), cross = host.querySelector('#pc-cross'), tip = host.querySelector('#pc-tip');
  const show = ev => {
    const r = host.getBoundingClientRect(), px = ev.clientX - r.left;
    const i = n === 1 ? 0 : clamp(Math.round(((px - m.l) / iw) * (n - 1)), 0, n - 1), h = H[i];
    cross.setAttribute('x1', pts[i][0]); cross.setAttribute('x2', pts[i][0]); cross.setAttribute('visibility', 'visible');
    tip.innerHTML = `<b>${h.label}</b>${DIV_NAME[h.div]} · ${ordinal(h.pos)} · ${h.Pts} pts${h.move ? ` · ${h.move}` : ''}${h.trophies.length ? `<br><span style="color:var(--gold)">🏆 ${h.trophies.map(esc).join(', ')}</span>` : ''}${h.luck ? `<br><span class="muted">Luck ${h.luck.value}/10</span>` : ''}`;
    tip.hidden = false;
    const tw = tip.offsetWidth;
    tip.style.left = clamp(pts[i][0] + 12, 0, W - tw) + 'px';
    tip.style.top = Math.max(0, pts[i][1] - 50) + 'px';
  };
  hit.addEventListener('pointermove', show);
  hit.addEventListener('pointerdown', show);
  hit.addEventListener('pointerleave', () => { tip.hidden = true; cross.setAttribute('visibility', 'hidden'); });
}

function renderHistory() {
  if (!S.history.length) return `<div class="card"><div class="empty">Your club history starts after your first season.</div></div>`;
  const cab = {};

  const order = ['Premier League', 'Champions League', 'FA Cup', 'League Cup', 'Europa League', 'Conference League', 'Championship', 'Championship play-off', 'League One', 'League One play-off', 'League Two', 'League Two play-off', 'National League', 'National League play-off'];

  let html = `<div class="card"><div class="row between"><h2 style="margin:0">League position by season</h2><span class="muted small">Position within the English pyramid · hover for details</span></div><div style="height:10px"></div>

  html += `<div class="card"><h2>Season by season</h2>${table('hist', [
    { k: 'label', l: 'Season', f: r => `<a href="#" data-action="goseason" data-v="${r.h.season}">${r.label}</a>` }, { k: 'div', l: 'Division' },

    { k: 'Pts', l: 'Pts', n: 1 }, { k: 'rec', l: 'W-D-L', f: r => `${r.h.W}-${r.h.D}-${r.h.L}` }, { k: 'GF', l: 'GF', n: 1 }, { k: 'GA', l: 'GA', n: 1 },
    { k: 'fa', l: 'FA Cup', f: r => r.h.fa || '—' }, { k: 'lc', l: 'League Cup', f: r => r.h.lc || '—' },
    { k: 'eu', l: 'Europe', f: r => r.h.euro ? `${COMP_SHORT[r.h.euro.code]} · ${r.h.euro.result}` : '—' },
    { k: 'tr', l: 'Trophies', f: r => r.h.trophies.length ? `<span style="color:var(--gold);font-weight:650">${r.h.trophies.map(esc).join(', ')}</span>` : '' },
    { k: 'ts', l: 'Top scorer', f: r => r.h.awards.topScorer ? `${esc(r.h.awards.topScorer.name)} (${r.h.awards.topScorer.n})` : '' },
    { k: 'po', l: 'Player of the Season', f: r => r.h.awards.clubPots ? esc(r.h.awards.clubPots.name) : '' },
    { k: 'luck', l: 'Luck', n: 1, f: r => r.h.luck ? `${r.h.luck.value}<span class="muted small">/10</span>` : '—' },
    { k: 'net', l: 'Net spend', n: 1, f: r => money(round1(r.h.transfers.spent - r.h.transfers.received)).replace('£-', '-£') },
  ], rows, { nosort: true })}</div>`;

function addSheet(wb, name, rows, totals) {
  const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{ Note: 'No data yet' }]);
  if (totals && rows.length) XLSX.utils.sheet_add_json(ws, [totals], { skipHeader: true, origin: -1 });
  const keys = Object.keys(rows[0] || { Note: '' });
  ws['!cols'] = keys.map(k => ({ wch: Math.min(40, Math.max(k.length, ...rows.map(r => String(r[k] ?? '').length)) + 2) }));
  XLSX.utils.book_append_sheet(wb, ws, name.slice(0, 31));
}
function flash(text, ok) { UI.flash = { text, ok }; if (UI.tab === 'data') render(); }
/* Inside claude.ai the page cannot start downloads itself: it asks the viewer through the
   `downloads` capability. Opened as a plain local file, it falls back to a normal browser download. */
async function download(name, data, type) {
  const framed = !!(window.claude && typeof window.claude.use === 'function');
  if (framed) {
    let dl = null; try { dl = await window.claude.use('downloads'); } catch (e) { /* unavailable */ }
    if (!dl) { flash("Downloads aren't available in this view. Open the page in claude.ai to download files."); return false; }
    try { await dl.save({ filename: name, data: typeof data === 'string' ? data : new Blob([data]) }); flash(`Downloaded ${name}.`, true); return true; }
    catch (e) { flash(e && e.code === 'declined' ? 'Download cancelled.' : `Couldn't download ${name} (${(e && e.code) || 'error'}).`); return false; }
  }
  const blob = new Blob([data], { type }); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  return true;
}
async function exportXlsx() {
  const stamp = seasonAscii(S.season);
  if (typeof XLSX === 'undefined') {
    const csv = rows => { if (!rows.length) return ''; const k = Object.keys(rows[0]); return [k.join(','), ...rows.map(r => k.map(x => `"${String(r[x] ?? '').replace(/"/g, '""')}"`).join(','))].join('\n'); };
    if (!await download(`${fileTag()}_register_${stamp}.csv`, csv(registerExportRows()), 'text/csv')) return;
    if (!await download(`${fileTag()}_player_seasons_${stamp}.csv`, csv(playerSeasonRows()), 'text/csv')) return;
    await download(`${fileTag()}_summary_${stamp}.csv`, csv(summaryRows()), 'text/csv');
    return;
  }
  const wb = XLSX.utils.book_new();
  addSheet(wb, 'Season Summary', summaryRows());
  addSheet(wb, 'Trophy Cabinet', trophyRows());
  addSheet(wb, 'Player Register', registerExportRows());
  addSheet(wb, `Squad ${stamp} (current)`, currentSquadRows());
  S.history.slice().reverse().forEach(h => {
    const rows = rosterRowsFor(h.season);
    const sum = k => rows.reduce((a, r) => a + (+r[k] || 0), 0);
    addSheet(wb, `Roster ${seasonAscii(h.season)}`, rows, { Pos: '', Positions: '', Name: 'TEAM TOTAL', Nat: '', Age: '', OVR: '', Apps: sum('Apps'), Starts: sum('Starts'), 'Sub apps': sum('Sub apps'), Minutes: sum('Minutes'), Goals: sum('Goals'), Assists: sum('Assists'), 'Yellow cards': sum('Yellow cards'), 'Red cards': sum('Red cards'), 'Avg rating': '', POTM: sum('POTM'), 'League goals': sum('League goals'), 'Games injured': sum('Games injured') });
  });
  addSheet(wb, 'All Player Seasons', playerSeasonRows());
  const buf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  await download(`${fileTag()}_Manager_${stamp}.xlsx`, buf, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}

    case 'sort': { const id = el.dataset.table, k = el.dataset.key, cur = UI.sort[id]; UI.sort[id] = { k, d: cur && cur.k === k && cur.d === 'desc' ? 'asc' : 'desc' }; render(); break; }
    case 'play': playSeason(); break;
    case 'next': nextSeason(); break;
    case 'buy': buyPlayer(+el.dataset.id); save(); render(); break;
    case 'posf': UI.posFilter = el.dataset.v; render(); break;
    case 'regf': UI.regFilter = el.dataset.v; render(); break;
    case 'fixf': UI.fixFilter = el.dataset.v; render(); break;
    case 'goseason': UI.viewSeason = +el.dataset.v; UI.tab = 'season'; render(); window.scrollTo(0, 0); break;
    case 'bxi-pick': UI.bxiSeason = +el.dataset.v; render(); document.getElementById('bxi-top')?.scrollIntoView({ block: 'start' }); break;
    case 'bxi-step': bxiStep(+el.dataset.v); break;
    case 'bxi-mode': UI.bxiMode = el.dataset.v; UI.planSlot = null; render(); break;
    case 'plan-slot': { const i = +el.dataset.v; UI.planSlot = UI.planSlot === i ? null : i; render(); break; }
    case 'plan-close': UI.planSlot = null; render(); break;
    case 'plan-auto': { const pins = S.lineups[S.settings.formation] = { ...pinsFor(S.settings.formation) }; delete pins[UI.planSlot]; UI.planSlot = null; save(); render(); break; }
    case 'plan-pick': {
      const id = +el.dataset.id, pins = { ...pinsFor(S.settings.formation) };
      Object.keys(pins).forEach(k => { if (pins[k] === id) delete pins[k]; }); // a player can only be pinned once
      pins[UI.planSlot] = id; S.lineups[S.settings.formation] = pins; UI.planSlot = null; save(); render(); break;
    }
    case 'plan-clear': S.lineups[S.settings.formation] = {}; UI.planSlot = null; save(); render(); break;
    case 'market-pos': UI.tab = 'transfers'; UI.posFilter = el.dataset.v; render(); window.scrollTo(0, 0); break;
    case 'player': UI.modal = +el.dataset.id; renderModal(); break;
    case 'close': case 'close-bg': UI.modal = null; renderModal(); break;
    case 'export': exportXlsx(); break;
    case 'savefile': download(`the-gaffer-${fileTag()}-${seasonAscii(S.season)}.json`, JSON.stringify(S), 'application/json'); break;
    case 'loadfile': document.getElementById('loadfile').click(); break;
    case 'apply-recs': applyRecommendations(); save(); render(); break;
    case 'reset-decs': resetDecisions(); save(); render(); break;
    case 'newgame': UI.picker = true; UI.pickClub = myName(); render(); window.scrollTo(0, 0); break;
    case 'pick-club': UI.pickClub = el.dataset.v; render(); break;
    case 'pick-cancel': UI.picker = false; render(); break;
    case 'pick-start': if (UI.pickClub && UI.cloudChecked) { newGame(false, UI.pickClub); UI.picker = false; render(); window.scrollTo(0, 0); } break;
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.change === 'decide') { const p = S.players[+el.dataset.id]; if (p) { p.decision = el.value; save(); render(); } }
  if (el.dataset.change === 'viewseason') { UI.viewSeason = +el.value; render(); }
  if (el.dataset.change === 'formation') { S.settings.formation = el.value; UI.planSlot = null; save(); render(); }
  if (el.dataset.change === 'bxi-form') { UI.bxiForm = el.value; render(); }
  if (el.dataset.change === 'bxi-season') { UI.bxiSeason = +el.value; render(); }
  if (el.dataset.change === 'luck') { S.settings.luck = el.value; save(); render(); }
  if (el.dataset.change === 'autofill') { S.settings.autoFill = el.checked; if (el.checked) applyRecommendations(); save(); render(); }
});
document.getElementById('loadfile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data.players || !data.history) throw new Error('bad file');
    adoptState(data);
    UI.picker = false; save(); UI.tab = 'squad'; UI.flash = null; render();
  } catch (err) { flash("That file isn't a save from The Gaffer, so nothing was loaded."); }
  e.target.value = '';
});
function bxiStep(d) {
  if (!S.history.length) return;
  const cur = S.history.findIndex(x => x.season === UI.bxiSeason);
  const i = clamp((cur < 0 ? S.history.length - 1 : cur) + d, 0, S.history.length - 1);
  UI.bxiSeason = S.history[i].season;
  render();
  const btn = document.querySelector(`[data-action="bxi-step"][data-v="${d}"]`);
  if (btn && !btn.disabled) btn.focus();
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && UI.modal) { UI.modal = null; renderModal(); return; }
  // ← / → flick through seasons on the Best XI tab (not while a dropdown or field has focus)
  const tag = document.activeElement && document.activeElement.tagName;
  if (S && !UI.picker && UI.tab === 'bestxi' && UI.bxiMode === 'past' && !UI.modal && (e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !['INPUT', 'SELECT', 'TEXTAREA'].includes(tag)) {
    e.preventDefault(); bxiStep(e.key === 'ArrowLeft' ? -1 : 1);
  }
});
let resizeT = null;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (UI.tab === 'history') drawPosChart(); }, 150); });

if (!load()) { S = null; UI.picker = true; UI.pickClub = null; }
Cloud.bootSavedAt = (S && S.savedAt) || 0;
UI.cloudChecked = false;
render();
// a career saved to the viewer's account wins over the picker; the Start button waits for this check
cloudInit().finally(() => { UI.cloudChecked = true; if (UI.picker) render(); });
</script>
</body>
</html>
