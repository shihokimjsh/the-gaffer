<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Gaffer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: a matchday-programme ledger — striped masthead, stat strip, tabbed tables. */
:root{
  --font-display:"Barlow Condensed","Arial Narrow",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Source Sans 3",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bg:#f4f4f1; --surface:#ffffff; --surface-2:#f1f1ed; --text:#151515; --muted:#686862;
  --border:#e2e2dc; --strong:#151515; --on-strong:#fafafa; --gold:#9c7a14;
  --win:#1e8049; --loss:#c03a3a; --draw:#8b8b83; --hl:rgba(21,21,21,.05);
  --warn-bg:#fff3d6; --warn:#7d5200; --err-bg:#fde6e6; --err:#a52a2a; --ok-bg:#e3f4ea;
  --gk:rgba(214,160,0,.20); --def:rgba(40,110,220,.16); --mid:rgba(30,150,80,.16); --att:rgba(210,60,60,.16);
  --ucl:#2b5fd9; --uel:#e07b00; --uecl:#1f9d6a; --rel:#c03a3a;
  --c-gk:#e3a800; --c-def:#2563c9; --c-mid:#1e8a4c; --c-att:#d03535; --dot-ink:#ffffff; --gk-ink:#1a1a1a;
  --pitch:#e6eee2; --pitch-line:#c2d0bb; --series:#1f5fbf; --band:rgba(21,21,21,.035);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e0e0f; --surface:#18181a; --surface-2:#212124; --text:#efefeb; --muted:#9c9c96;
    --border:#2c2c30; --strong:#efefeb; --on-strong:#111; --gold:#e2bb4f;
    --win:#4cc27c; --loss:#ef6b6b; --draw:#9c9c96; --hl:rgba(255,255,255,.06);
    --warn-bg:#3a2e12; --warn:#f0c46a; --err-bg:#3d1a1a; --err:#ff9a9a; --ok-bg:#17301f;
    --gk:rgba(230,180,30,.22); --def:rgba(80,140,255,.22); --mid:rgba(60,190,110,.20); --att:rgba(240,90,90,.22);
    --ucl:#6f97ff; --uel:#ffa53d; --uecl:#4fd19c; --rel:#ef6b6b;
    --c-gk:#f0c53a; --c-def:#3d76dc; --c-mid:#279657; --c-att:#d94545; --dot-ink:#ffffff; --gk-ink:#1a1a1a;
    --pitch:#152019; --pitch-line:#2b3b2f; --series:#7aa5ff; --band:rgba(255,255,255,.04);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e0e0f; --surface:#18181a; --surface-2:#212124; --text:#efefeb; --muted:#9c9c96;
  --border:#2c2c30; --strong:#efefeb; --on-strong:#111; --gold:#e2bb4f;
  --win:#4cc27c; --loss:#ef6b6b; --draw:#9c9c96; --hl:rgba(255,255,255,.06);
  --warn-bg:#3a2e12; --warn:#f0c46a; --err-bg:#3d1a1a; --err:#ff9a9a; --ok-bg:#17301f;
  --gk:rgba(230,180,30,.22); --def:rgba(80,140,255,.22); --mid:rgba(60,190,110,.20); --att:rgba(240,90,90,.22);
  --ucl:#6f97ff; --uel:#ffa53d; --uecl:#4fd19c; --rel:#ef6b6b;
  --c-gk:#f0c53a; --c-def:#3d76dc; --c-mid:#279657; --c-att:#d94545; --dot-ink:#ffffff; --gk-ink:#1a1a1a;
  --pitch:#152019; --pitch-line:#2b3b2f; --series:#7aa5ff; --band:rgba(255,255,255,.04);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14.5px/1.45 var(--font-body);-webkit-font-smoothing:antialiased}
h1,h2,.stat .v,.kpi .v,.cab .n{font-family:var(--font-display);letter-spacing:.2px;text-wrap:balance}
h2{font-weight:700}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--strong);outline-offset:2px}
.top :focus-visible{outline-color:#f4f4f4}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline}
td a{font-weight:inherit}
.stripes{height:6px;background:repeating-linear-gradient(90deg,var(--club-a,#111) 0 14px,var(--club-b,#f4f4f4) 14px 28px)}
header.top{background:#111;color:#f4f4f4}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-top:14px;padding-bottom:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.crest{width:38px;height:38px;border-radius:8px;border:2px solid #f4f4f4;flex:none;background:repeating-linear-gradient(90deg,var(--club-b,#f4f4f4) 0 7px,var(--club-a,#111) 7px 14px)}
.crest.split,.swatch.split{background:linear-gradient(135deg,var(--club-a) 0 50%,var(--club-b) 50% 100%)}
.swatch{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);flex:none;background:repeating-linear-gradient(90deg,var(--club-b) 0 6px,var(--club-a) 6px 12px)}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pick{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:12px;cursor:pointer}
.pick:hover{background:var(--surface-2)}
.pick.on{border-color:var(--strong);box-shadow:0 0 0 1px var(--strong)}
.pick b{display:block;font-size:15px}
.pick .d{font-size:12px;color:var(--muted);line-height:1.35;margin-top:2px}
.pickbar{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-top:14px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.brand h1{margin:0;font-size:24px;letter-spacing:.4px;line-height:1.05;text-transform:uppercase}
.brand .sub{font-size:12px;color:#b9b9b3}
.top .spacer{flex:1}
.top .btn-primary{background:#f4f4f4;color:#111;border-color:#f4f4f4}
.top .btn-primary:disabled{opacity:.45;cursor:not-allowed}
.statbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin:16px 0}
.stat{background:var(--surface);padding:10px 14px;box-shadow:0 0 0 .5px var(--border)}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.stat .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.stat .v small{font-size:12px;font-weight:500;color:var(--muted)}
.stat .v.bad{color:var(--err)}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:550}
nav.tabs button.on{color:var(--text);border-bottom-color:var(--strong)}
main{padding:16px 0 60px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:550;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--strong);color:var(--on-strong);border-color:var(--strong)}
.btn-primary:hover{opacity:.9;background:var(--strong)}
.btn-sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-danger{color:var(--err)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:19px}
.card h3{margin:16px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.between{justify-content:space-between}
.muted{color:var(--muted)}
.banner{border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13.5px}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.err{background:var(--err-bg);color:var(--err)}
.banner.ok{background:var(--ok-bg)}
.banner ul{margin:4px 0 0;padding-left:18px}
.news{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.news li{padding:8px 10px;border-radius:8px;background:var(--surface-2);font-size:13.5px}
.news li b{font-weight:650}
.tbl{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 9px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--border);font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;background:var(--surface-2);position:sticky;top:0;user-select:none}
th.s{cursor:pointer}
th.s:hover{color:var(--text)}
th .arr{font-size:9px;margin-left:3px}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--hl)}
tr.nu td{background:var(--hl);font-weight:650}
tr.tot td{font-weight:700;background:var(--surface-2)}
tr.click{cursor:pointer}
td.name{font-weight:550}
.pos{display:inline-block;min-width:30px;text-align:center;padding:1px 5px;border-radius:5px;font-size:11px;font-weight:700}
.pos.GK{background:var(--gk)}.pos.DEF{background:var(--def)}.pos.MID{background:var(--mid)}.pos.ATT{background:var(--att)}
.pill{display:inline-block;width:20px;text-align:center;border-radius:5px;font-size:11px;font-weight:700;color:#fff;padding:1px 0}
.pill.W{background:var(--win)}.pill.D{background:var(--draw)}.pill.L{background:var(--loss)}
.tag{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:650;background:var(--surface-2);color:var(--muted)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.err{background:var(--err-bg);color:var(--err)}
.tag.gold{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.tag.inj{background:var(--err-bg);color:var(--err)}
select.dec,select.seasonsel{padding:4px 6px;border-radius:7px;border:1px solid var(--border);background:var(--surface);font-size:12.5px}
select.dec{width:240px;max-width:100%;text-overflow:ellipsis}
select.dec.changed{border-color:var(--strong);font-weight:600}
.pitch{position:relative;background:var(--pitch);border:2px solid var(--pitch-line);border-radius:10px;aspect-ratio:68/100;width:100%;overflow:hidden}
.pl-half{position:absolute;left:0;right:0;top:50%;border-top:2px solid var(--pitch-line)}
.pl-circle{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;border:2px solid var(--pitch-line);border-radius:50%;transform:translate(-50%,-50%)}
.pl-box{position:absolute;left:24%;right:24%;height:13%;border:2px solid var(--pitch-line)}
.pl-box.top{top:-2px}.pl-box.bottom{bottom:-2px}
.pp{position:absolute;transform:translate(-50%,-30%);display:flex;flex-direction:column;align-items:center;gap:2px;width:88px;text-align:center;pointer-events:none}
.pp .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-variant-numeric:tabular-nums;font-weight:700;color:var(--dot-ink);border:2px solid var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.pp.GK .dot{background:var(--c-gk);color:var(--gk-ink)}.pp.DEF .dot{background:var(--c-def)}.pp.MID .dot{background:var(--c-mid)}.pp.ATT .dot{background:var(--c-att)}
.pp .nm{font-size:12.5px;font-weight:700;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp .st{font-size:10.5px;color:var(--muted);white-space:nowrap}
.pp .lab{font-size:9.5px;font-weight:700;letter-spacing:.5px;color:var(--muted);line-height:1}
.pp.clickable{pointer-events:auto;cursor:pointer;background:none;border:0;padding:2px;font:inherit;color:inherit;border-radius:8px}
.pp.clickable:hover .dot{transform:scale(1.08)}
.pp.weak .dot{box-shadow:0 0 0 3px var(--loss)}
.pp.sel .dot{box-shadow:0 0 0 3px var(--strong)}
.chooser{display:flex;flex-direction:column;gap:6px;max-height:560px;overflow-y:auto;padding-right:2px}
.choice{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:8px 10px;cursor:pointer}
.choice:hover{background:var(--surface-2)}
.choice.on{border-color:var(--strong);box-shadow:0 0 0 1px var(--strong)}
.choice .muted{display:block;margin-top:2px}
.choice .rt{font-family:var(--font-display);font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.depth{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.dcard{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--surface)}
.dcard.unused{opacity:.72}
.dcard > .row.between{margin-bottom:6px}
.drow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;padding:4px 0;border-top:1px solid var(--border)}
.drow.xi a{font-weight:700}
.drow b{font-variant-numeric:tabular-nums}
.drow b.best{color:var(--win)}.drow b.worst{color:var(--loss)}
.chips.sub .chip{padding:2px 9px;font-size:12px}
.pitch.mini{border-width:1px;border-radius:6px}
.mini .pl-half,.mini .pl-circle,.mini .pl-box{border-width:1px}
.mini .pp{width:46px;gap:1px;transform:translate(-50%,-25%)}
.mini .pp .dot{width:16px;height:16px;border-width:1px;font-size:8px}
.mini .pp .nm{font-size:8.5px;font-weight:650}
.bxi-main{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.bxi-main{grid-template-columns:minmax(0,1fr)}}
.bxi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.bxi-card{border:1px solid var(--border);border-radius:10px;padding:8px;background:var(--surface);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px}
.bxi-card:hover{background:var(--surface-2)}
.bxi-card.on{border-color:var(--strong);box-shadow:0 0 0 1px var(--strong)}
.bxi-card .lbl{font-size:12px;font-weight:700;display:flex;justify-content:space-between;gap:6px}
.bxi-card .lbl span{font-weight:500;color:var(--muted)}
.keyrow{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin:10px 0 0}
.keyrow i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.chartwrap{position:relative}
.chartwrap svg{display:block;width:100%;overflow:visible}
.chartwrap text{font-family:var(--font-body);font-size:11px;fill:var(--muted)}
.chartwrap .bandlbl{font-size:10.5px;font-weight:650;letter-spacing:.4px;text-transform:uppercase}
.charttip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.12);white-space:nowrap;z-index:2}
.charttip b{display:block;font-size:13px}
.altpos{margin-left:5px;font-size:11px;font-weight:650;color:var(--muted);letter-spacing:.3px}
.shape{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:10px}
.unit{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--surface)}
.unit .k{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.unit .v{font-family:var(--font-display);font-size:24px;font-weight:700;line-height:1.1}
.unit.weak{border-color:var(--loss)}
.unit.weak .v{color:var(--loss)}
.unit .d{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.3}
.adv{display:flex;flex-direction:column;gap:1px;min-width:170px;white-space:normal;line-height:1.25}
.adv b{font-size:12px;font-weight:700}
.adv span{font-size:11.5px;color:var(--muted)}
.adv.match b::after{content:" ✓";color:var(--win)}
.adv-sell b,.adv-release b,.adv-leave b,.adv-retire b{color:var(--loss)}
.adv-loan b{color:var(--uel)}
.adv-renew b{color:var(--win)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 12px;margin:12px 0;border-radius:10px;background:var(--surface-2)}
.toolbar label{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.toolbar .spacer{flex:1}
.luckpick{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:#c9c9c3}
.luckpick select{background:#222;color:#f4f4f4;border:1px solid #444;border-radius:7px;padding:6px 8px;font-size:13px}
.luckbar{display:inline-flex;gap:2px;vertical-align:middle;margin-left:6px}
.luckbar i{width:6px;height:12px;border-radius:2px;background:var(--border)}
.luckbar i.on{background:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:12.5px;cursor:pointer}
.chip.on{background:var(--strong);color:var(--on-strong);border-color:var(--strong)}
.grid{display:grid;gap:16px}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.kpi .k{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.kpi .v{font-size:23px;font-weight:700;margin-top:3px;line-height:1.1}
.kpi .v.gold{color:var(--gold)}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.trophies{display:flex;flex-wrap:wrap;gap:8px}
.trophy{border:1px solid var(--gold);color:var(--gold);border-radius:8px;padding:6px 10px;font-weight:650}
.cabinet{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.cab{border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--surface)}
.cab .n{font-size:34px;font-weight:750;color:var(--gold);line-height:1}
.cab .t{font-weight:650;margin-top:4px}
.cab .y{font-size:12px;color:var(--muted);margin-top:4px}
.zone-ucl td:first-child{box-shadow:inset 3px 0 0 var(--ucl)}
.zone-uel td:first-child{box-shadow:inset 3px 0 0 var(--uel)}
.zone-uecl td:first-child{box-shadow:inset 3px 0 0 var(--uecl)}
.zone-rel td:first-child{box-shadow:inset 3px 0 0 var(--rel)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;padding:calc(40px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:50;overflow-y:auto}
.modal h2{font-size:26px}
.modal{background:var(--surface);border-radius:14px;max-width:900px;width:100%;padding:20px;border:1px solid var(--border)}
.modal h2{margin:0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 16px;margin:14px 0}
.facts div{font-size:13px}
.facts > div > span:first-child{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
footer{font-size:12px;color:var(--muted);padding:20px 0 40px;border-top:1px solid var(--border)}
.small{font-size:12px}
.nowrap{white-space:nowrap}
@media (max-width:640px){
  .brand h1{font-size:16px}
  .top .spacer{display:none}
  .top .actions{width:100%}
  .top .actions .btn{flex:1;justify-content:center}
}
</style>
</head>
<body>
<div class="stripes"></div>

function genName(nat, track = true) {

  for (let i = 0; i < 40; i++) {
    const f = pick(n.f), l = pick(n.l), k = f + ' ' + l;
    if (!USED_NAMES.has(k)) { if (track) USED_NAMES.add(k); return [f, l]; }
  }

}
function potFor(a, ovr) {

  if (a <= 19) p = ovr + rint(6, 22);

  else if (a <= 23) p = ovr + rint(2, 10);
  else if (a <= 26) p = ovr + rint(0, 5);
  else p = ovr + rint(0, 2);

}

function marketValue(p, season = S.season) {

}

/* ---------------- lineup & strength ---------------- */
/* Fill the formation's slots: greedy by scarcity, then improve by swapping two starters'
   slots or bringing in a better-fitting reserve. Used for match line-ups and the Best XI. */
function assignSlots(cands, types, val) {
  const left = cands.slice(), xi = [];
  const order = types.map((t, i) => i).sort((a, b) => SLOT_PRI.indexOf(types[a]) - SLOT_PRI.indexOf(types[b]));
  for (const i of order) {
    let best = null, bs = -1e9;
    for (const p of left) { const s = val(p, types[i], i); if (s > bs) { bs = s; best = p; } }
    if (!best) break;
    left.splice(left.indexOf(best), 1);
    xi.push({ p: best, slot: types[i], idx: i });
  }
  for (let pass = 0; pass < 2; pass++) {
    let changed = false;
    for (let i = 0; i < xi.length; i++) for (let j = i + 1; j < xi.length; j++) {
      const a = xi[i], b = xi[j];
      if (val(a.p, b.slot, b.idx) + val(b.p, a.slot, a.idx) > val(a.p, a.slot, a.idx) + val(b.p, b.slot, b.idx) + 0.01) { [a.p, b.p] = [b.p, a.p]; changed = true; }
    }
    for (const x of xi) for (let k = 0; k < left.length; k++) {
      if (val(left[k], x.slot, x.idx) > val(x.p, x.slot, x.idx) + 0.01) { const out = x.p; x.p = left[k]; left[k] = out; changed = true; }
    }
    if (!changed) break;
  }
  xi.sort((a, b) => a.idx - b.idx);
  return { xi, rest: left };
}
// pins: {slotIndex: playerId} chosen by you for a formation; pinBonus is how hard the pick leans on them
function pickXI(avail, nf, types = formTypes(), pins = null, pinBonus = 0) {
  const pb = typeof pinBonus === 'function' ? pinBonus : () => pinBonus;
  const { xi, rest: left } = assignSlots(avail, types, (p, slot, idx) => p.ovr * fitP(p, slot) + nf(p) + (pins && pins[idx] === p.id ? pb(p) : 0));
  xi.forEach(x => x.eff = x.p.ovr * fitP(x.p, x.slot));
  return { xi, rest: left };
}
const pinsFor = key => (S.lineups && S.lineups[key]) || {};
// Your planned XI: pinned players always take their slot (if still in the squad), the rest are auto-picked.
const planXI = (list, key = S.settings.formation) => pickXI(list, () => 0, formTypes(key), pinsFor(key), 50);
/* Team strength by unit. Each unit is its average, pulled down by its weakest player
   (a hole in the back four costs more than the average shows). Attack and defence then
   combine the units, and goals come from our attack against their defence and vice versa. */
const COHESION = 1.3;
function teamUnits(xi, key = S.settings && S.settings.formation) {
  const by = { GK: [], DEF: [], MID: [], ATT: [] };
  xi.forEach(x => by[POS_GROUP[x.slot]].push(x.eff));
  const unit = a => a.length ? 0.85 * (a.reduce((s, v) => s + v, 0) / a.length) + 0.15 * Math.min(...a) : 45;
  const u = { GK: unit(by.GK), DEF: unit(by.DEF), MID: unit(by.MID), ATT: unit(by.ATT) };
  const [ta, td] = formOf(key).tilt;
  u.att = 0.55 * u.ATT + 0.35 * u.MID + 0.10 * u.DEF + ta;
  u.def = 0.45 * u.DEF + 0.25 * u.GK + 0.30 * u.MID + td;
  u.overall = (u.att + u.def) / 2;
  return u;
}
function nuStrength(list = squad()) {
  if (!list.length) return 55;
  const { xi } = pickXI(list, () => 0);
  let r = teamUnits(xi).overall + COHESION;
  // depth: thin squads suffer from fatigue over a season
  const depth = list.length;
  if (depth < 20) r -= (20 - depth) * 0.25;
  return round1(r);
}
function squadShape(list) {
  const { xi } = pickXI(list, () => 0);
  const u = teamUnits(xi);
  const counts = {}; formTypes().forEach(t => counts[t] = (counts[t] || 0) + 1);
  const thin = Object.keys(counts).map(pos => ({ pos, n: list.filter(p => posList(p).includes(pos)).length, need: counts[pos] + 1 })).filter(x => x.n < x.need)
    .sort((a, b) => POS_ORDER.indexOf(a.pos) - POS_ORDER.indexOf(b.pos));
  return { xi, u, thin };
}

/* ---------------- match engine ---------------- */
function lambdas2(attA, defA, attB, defB, adv) {
  const fa = gauss(0, 1.8), fb = gauss(0, 1.8); // each side's form on the day
  return [1.35 * Math.exp(0.058 * ((attA + fa) - (defB + fb)) + 0.12 * adv), 1.35 * Math.exp(0.058 * ((attB + fb) - (defA + fa)) - 0.12 * adv)];
}
// other clubs lean slightly attacking or defensive (bias), around their overall rating
const teamAD = id => { if (id === NU) { const r = rating(NU); return [r, r]; } const c = S.clubs[id]; const b = c.bias || 0; return [c.rating + b, c.rating - b]; };
const lambdasIds = (h, a, adv) => lambdas2(...teamAD(h), ...teamAD(a), adv);
function simIds(h, a, adv) { const [la, lb] = lambdasIds(h, a, adv); return [poisson(la), poisson(lb)]; }
function blankStat() { return { apps:0, starts:0, subs:0, mins:0, goals:0, assists:0, yc:0, rc:0, rSum:0, rN:0, potm:0, lgApps:0, lgGoals:0, lgAssists:0, pos:{} }; }
function st(ctx, id) { return ctx.st[id] || (ctx.st[id] = blankStat()); }

function nuMatch(ctx, oppId, venue, comp, label, koLevel) {
  const idx = ctx.matchIdx++;
  const pool = squad();
  let avail = pool.filter(p => idx >= (p._inj || 0) && idx >= (p._ban || 0));
  const oppR = rating(oppId);
  const isLeague = LEAGUE_CODES.includes(comp);
  const early = !['Semi-final', 'Final'].some(s => label.startsWith(s));
  const rotate = comp === 'LC' && early
    || (comp === 'FA' && early && oppR < ctx.nuBase - 5)
    || (EURO_RANK[comp] && label.startsWith('League phase') && oppR < ctx.nuBase - 8);
  // fatigue builds with minutes and wears off with rest days, so congested runs force rotation
  const t = ctx.t || 0;
  for (const p of pool) { p._fat = (p._fat || 0) * Math.exp(-(t - (p._fatT ?? t)) / 12); p._fatT = t; }
  const noise = new Map();
  for (const p of avail) {
    const fat = 2.6 * p._fat * p._fat;
    const youth = rotate && age(p) <= 21 ? 4 : 0;
    noise.set(p.id, gauss(0, rotate ? 5 : 1.5) - fat + youth);
  }
  if (avail.length < 11) {
    const extra = pool.filter(p => !avail.includes(p)).sort((a, b) => b.ovr - a.ovr);
    while (avail.length < 11 && extra.length) avail.push(extra.shift());
  }
  const nf = p => noise.get(p.id) || 0;
  // a pinned player starts unless he's injured, suspended, worn out (heavy fatigue) or it's a cup rotation game
  const { xi, rest } = pickXI(avail, nf, formTypes(ctx.formation), pinsFor(ctx.formation), p => rotate ? 4 : (p._fat || 0) > 1.7 ? 0 : 30);
  const bench = [];
  for (const b of rest.slice().sort((a, b) => (b.ovr + nf(b)) - (a.ovr + nf(a)))) {
    if (bench.length >= 9) break;
    if (b.pos === 'GK' && bench.some(x => x.pos === 'GK')) continue; // one keeper on the bench
    bench.push(b);
  }
  const u = teamUnits(xi, ctx.formation), boost = COHESION + (ctx.luckShift || 0);
  const nuAtt = u.att + boost, nuDef = u.def + boost, nuR = (nuAtt + nuDef) / 2;
  const [oppAtt, oppDef] = teamAD(oppId);
  const adv = venue === 'H' ? 1 : venue === 'A' ? -1 : 0;
  const [la, lb] = lambdas2(nuAtt, nuDef, oppAtt, oppDef, adv);
  let gf = poisson(la), ga = poisson(lb);
  const goals = [];
  for (let i = 0; i < gf; i++) goals.push({ m: rint(1, 90), us: true });
  for (let i = 0; i < ga; i++) goals.push({ m: rint(1, 90), us: false });
  let et = false, pens = null;
  if (koLevel && koLevel(gf, ga)) {
    et = true;
    const e1 = poisson(la * 0.3), e2 = poisson(lb * 0.3);
    for (let i = 0; i < e1; i++) goals.push({ m: rint(91, 120), us: true });
    for (let i = 0; i < e2; i++) goals.push({ m: rint(91, 120), us: false });
    gf += e1; ga += e2;
    if (koLevel(gf, ga)) {
      const nuWon = rand() < 0.5 + (nuR - oppR) * 0.01 + 0.1 * (ctx.luckL || 0);
      const w = rint(3, 5), l = Math.max(0, w - rint(1, 2));
      pens = { nuWon, nu: nuWon ? w : l, opp: nuWon ? l : w };
    }
  }
  const end = et ? 120 : 90;
  goals.sort((a, b) => a.m - b.m);
  const part = new Map();
  xi.forEach(x => part.set(x.p.id, { p: x.p, slot: x.slot, on: 0, off: end, start: true, g: 0, a: 0, y: 0, r: 0 }));
  // substitutions
  const nSubs = Math.min(bench.length, rint(3, 5));
  const subTimes = Array.from({ length: nSubs }, () => rint(55, 88)).sort((a, b) => a - b);
  const benchLeft = bench.slice();
  for (const t of subTimes) {
    const onPitch = [...part.values()].filter(x => x.on <= t && x.off === end && x.slot !== 'GK');
    if (!onPitch.length || !benchLeft.length) break;
    const out = weightedPick(onPitch, x => 1 + (age(x.p) >= 30 ? 1 : 0) + (POS_GROUP[x.slot] === 'ATT' ? 0.8 : 0) + (x.p.ovr < nuR ? 0.5 : 0));
    const cand = benchLeft.filter(b => b.pos !== 'GK');
    if (!cand.length) break;
    // the replacement is whoever on the bench best fits the departing player's slot
    const inn = cand.sort((a, b) => (b.ovr * fitP(b, out.slot) + nf(b)) - (a.ovr * fitP(a, out.slot) + nf(a)))[0];
    benchLeft.splice(benchLeft.indexOf(inn), 1);
    out.off = t;
    part.set(inn.id, { p: inn, slot: out.slot, on: t, off: end, start: false, g: 0, a: 0, y: 0, r: 0 });
  }
  const parts = [...part.values()];
  // cards
  for (const x of parts) {
    const share = (x.off - x.on) / 90;
    if (rand() < YELLOW_P[x.slot] * share) {
      x.y = 1;
      if (rand() < 0.035 * (1 - 0.5 * (ctx.luckL || 0))) { x.r = 1; x.off = rint(Math.max(x.on + 1, 30), x.off); }
    } else if (rand() < 0.004 * share * (1 - 0.5 * (ctx.luckL || 0))) { x.r = 1; x.off = rint(x.on + 1, x.off); }
  }
  // goals & assists
  const scorerLog = [];
  for (const g of goals) {
    if (!g.us) continue;
    const cands = parts.filter(x => x.on < g.m && g.m <= x.off);
    if (!cands.length || rand() < 0.03) { scorerLog.push({ name: 'OG', m: g.m }); continue; }
    const sc = weightedPick(cands, x => SCORE_W[x.slot] * Math.pow(x.p.ovr * fitP(x.p, x.slot) / 75, 4) + 0.001);
    sc.g++;
    scorerLog.push({ name: sc.p.last, m: g.m, id: sc.p.id });
    if (rand() < 0.76) {
      const ac = cands.filter(x => x !== sc);
      if (ac.length) weightedPick(ac, x => ASSIST_W[x.slot] * Math.pow(x.p.ovr * fitP(x.p, x.slot) / 75, 3)).a++;
    }
  }
  // ratings, stats
  const nuWin = gf > ga, nuLoss = gf < ga;
  let best = null;
  for (const x of parts) {
    const mins = x.off - x.on, grp = POS_GROUP[x.slot];
    let r = 6.35 + (x.p.ovr * fitP(x.p, x.slot) - 75) * 0.03 + (nuWin ? 0.35 : nuLoss ? -0.35 : 0) + x.g * 0.85 + x.a * 0.5 - x.y * 0.2 - x.r * 1.3 + gauss(0, 0.45);
    if ((grp === 'DEF' || grp === 'GK') && mins >= 60) r += ga === 0 ? (grp === 'GK' ? 0.8 : 0.5) : -0.17 * Math.min(ga, 4);
    if (mins < 30) r = 6.4 + (r - 6.4) * 0.55;
    x.rating = round1(clamp(r, 4, 10));
    if (!best || x.rating > best.rating) best = x;
    const s = st(ctx, x.p.id);
    s.apps++; if (x.start) s.starts++; else s.subs++;
    s.mins += mins; s.goals += x.g; s.assists += x.a; s.yc += x.y; s.rc += x.r;
    s.rSum += x.rating; s.rN++;
    s.pos[x.slot] = (s.pos[x.slot] || 0) + 1;
    if (isLeague) { s.lgApps++; s.lgGoals += x.g; s.lgAssists += x.a; }
    if (x.r) x.p._ban = idx + 2;
    if (x.y && isLeague) { x.p._lgY = (x.p._lgY || 0) + 1; if (x.p._lgY % 5 === 0) x.p._ban = Math.max(x.p._ban || 0, idx + 2); }
    if (rand() < 0.012 * (ctx.injMult || 1) * (mins / 90)) {
      const dur = rand() < clamp(0.12 * (1 - 0.6 * (ctx.luckL || 0)), 0.04, 0.22) ? rint(8, 22) : rint(1, 5);
      x.p._inj = idx + 1 + dur;
      x.p._injCount = (x.p._injCount || 0) + dur;
    }
  }
  if (best && (nuWin || (!nuLoss && best.rating >= 7.5) || best.rating >= 8.3)) st(ctx, best.p.id).potm++;
  for (const x of parts) x.p._fat = (x.p._fat || 0) + ((x.off - x.on) / 90) * (age(x.p) >= 31 ? 1.25 : 1);
  // scorer string
  const byName = {};
  scorerLog.forEach(s => { (byName[s.name] = byName[s.name] || []).push(s.m + "'"); });
  ctx.fixtures.push({ n: idx + 1, comp, label, opp: oppId, venue, gf, ga, et, pens: pens ? [pens.nu, pens.opp] : null,
    sc: Object.entries(byName).map(([n, ms]) => `${n} ${ms.join(', ')}`).join('; ') });
  return { gf, ga, et, pens };
}

function playPlain(ctx, h, a, comp, label) {

/* ---------------- luck ----------------
   One luck value per season, 0 (very bad) to 10 (very good); 5 is neutral.
   Random mode: 85% from Binomial(10, 0.5), so most seasons land at 4-6, plus 15% uniform 0-10,
   so extreme seasons happen roughly once every 30-40 years.
   With l = (luck - 5) / 5 in [-1, 1], luck changes:
   - form: your club plays +/- 7 * |l|^1.5 rating points above or below their level
     (about +/-0.6 at 4/6, +/-1.8 at 3/7, +/-3.3 at 2/8, +/-5 at 1/9, +/-7 at 0/10)
   - injuries: 2^(-1.3 * l) times the normal rate (about 2.5x at 0, 0.4x at 10), with more
     long-term injuries when luck is bad
   - red cards and suspensions, penalty shootouts, and cup draws (good luck avoids the
     strongest opponents, bad luck draws them)

    const nat = weightedKey(NAT_W), [f, l] = genName(nat, false);
    const goals = Math.round(r.GF * rfloat(0.16, 0.36));
    stars.push({ name: `${f} ${l}`, club: r.id, goals, score: 6.85 + (cr - 75) * 0.025 + (8 - Math.min(ps, 8)) * 0.05 + goals * 0.025 + gauss(0, 0.15) });
    const [yf, yl] = genName(weightedKey(NAT_W), false);
    stars.push({ name: `${yf} ${yl}`, club: r.id, goals: Math.round(r.GF * rfloat(0.03, 0.18)), young: true, score: 6.7 + (cr - 75) * 0.02 + (8 - Math.min(ps, 8)) * 0.04 + gauss(0, 0.2) });
  });
  const nuScore = x => x.s.rSum / x.s.rN + x.s.lgGoals * 0.025 + x.s.lgAssists * 0.018 + (8 - Math.min(nuPos, 8)) * 0.05;
  // golden boot
  let gb = { name: '', club: '', goals: -1 };
  stars.forEach(s => { if (s.goals > gb.goals) gb = { name: s.name, club: clubName(s.club), goals: s.goals }; });
  nu.forEach(x => { if (x.s.lgGoals > gb.goals || (x.s.lgGoals === gb.goals && rand() < .5)) gb = { name: fullName(x.p), club: clubName(NU), goals: x.s.lgGoals, pid: x.p.id }; });
  const best = (cands) => cands.sort((a, b) => b.score - a.score)[0];
  const nuElig = nu.filter(x => x.s.lgApps >= games * 0.5 && x.s.rN);
  const potsC = stars.filter(s => !s.young).map(s => ({ name: s.name, club: clubName(s.club), score: s.score }))
    .concat(nuElig.map(x => ({ name: fullName(x.p), club: clubName(NU), score: nuScore(x), pid: x.p.id })));
  const youngC = stars.filter(s => s.young).map(s => ({ name: s.name, club: clubName(s.club), score: s.score }))
    .concat(nu.filter(x => age(x.p) <= 23 && x.s.lgApps >= games * 0.4 && x.s.rN).map(x => ({ name: fullName(x.p), club: clubName(NU), score: nuScore(x) - 0.1, pid: x.p.id })));
  const pots = best(potsC), ypots = best(youngC);
  // club awards
  const totalGames = ctx.matchIdx;
  const regs = nu.filter(x => x.s.apps >= Math.max(10, totalGames * 0.35) && x.s.rN);
  const clubScore = x => x.s.rSum / x.s.rN + (x.s.goals + x.s.assists * 0.7) * 0.012;
  const cp = regs.sort((a, b) => clubScore(b) - clubScore(a))[0];
  const cy = nu.filter(x => age(x.p) <= 21 && x.s.apps >= 8 && x.s.rN).sort((a, b) => clubScore(b) - clubScore(a))[0];
  const ts = nu.slice().sort((a, b) => b.s.goals - a.s.goals || a.s.mins - b.s.mins)[0];
  const ta = nu.slice().sort((a, b) => b.s.assists - a.s.assists || a.s.mins - b.s.mins)[0];
  const pack = x => x ? { name: fullName(x.p), pid: x.p.id } : null;
  return {
    goldenBoot: gb, pots: pots ? { name: pots.name, club: pots.club, pid: pots.pid } : null, ypots: ypots ? { name: ypots.name, club: ypots.club, pid: ypots.pid } : null,
    clubPots: pack(cp), clubYoung: pack(cy),
    topScorer: ts ? { name: fullName(ts.p), pid: ts.p.id, n: ts.s.goals } : null,
    topAssists: ta ? { name: fullName(ta.p), pid: ta.p.id, n: ta.s.assists } : null,
  };
}

function simLoanSeason(p, Y) {
  const club = S.clubs[p.loan.club]; const cr = club.rating;
  const share = clamp(0.4 + (p.ovr - cr) * 0.06 + gauss(0, 0.15), 0.03, 0.95);
  const games = club.div === 'EU' ? 40 : club.div === 'PL' ? 44 : 49;
  const apps = Math.round(games * clamp(share + 0.12, 0, 1));
  const starts = Math.round(apps * share / (share + 0.12));
  const mins = starts * rint(78, 86) + (apps - starts) * rint(15, 25);
  const k = Math.pow(p.ovr / cr, 2) * mins / 90;
  const gRate = { GK: 0, RB: .04, LB: .04, CB: .05, DM: .05, CM: .1, AM: .25, RW: .3, LW: .3, ST: .45 }[p.pos];
  const aRate = { GK: .01, RB: .12, LB: .12, CB: .03, DM: .08, CM: .15, AM: .25, RW: .25, LW: .25, ST: .15 }[p.pos];
  const goals = poisson(gRate * k), assists = Math.min(poisson(aRate * k), Math.max(goals, poisson(aRate * k)));
  p.seasons.push({ season: Y, club: club.id, loan: true, age: age(p), ovr: Math.round(p.ovr), apps, starts, subs: apps - starts, mins, goals, assists,
    yc: poisson(YELLOW_P[p.pos] * apps), rc: rand() < 0.04 ? 1 : 0, avg: apps ? round1(clamp(6.6 + (p.ovr - cr) * 0.04 + gauss(0, 0.2), 5.8, 8.2)) : null, potm: poisson(apps * 0.06), lgGoals: goals, lgApps: apps, injured: 0 });
}

function seasonIncome(rec) {
  let inc = { PL: 55, CH: 12, L1: 4, L2: 2, NL: 1 }[rec.div];
  if (rec.div === 'PL') inc += (21 - rec.pos) * 2.2;
  if (rec.euro) {
    const base = { UCL: 30, UEL: 12, UECL: 6 }[rec.euro.code];
    const stage = ['League phase', 'Knockout play-off', 'Round of 16', 'Quarter-final', 'Semi-final', 'Runners-up', 'Winners'].indexOf(rec.euro.result);
    inc += base + Math.max(0, stage) * base * 0.15;
  }
  const bonus = { 'Premier League': 25, 'FA Cup': 6, 'League Cup': 3, 'Champions League': 25, 'Europa League': 10, 'Conference League': 5, 'Championship': 5 };
  rec.trophies.forEach(t => inc += bonus[t] || 0);
  return Math.round(inc);
}

/* ---------------- between seasons ---------------- */
function develop(p, share, l = 0) {
  const a = age(p);
  const base = a <= 18 ? 4.5 : a <= 20 ? 3.5 : a <= 22 ? 2.5 : a <= 24 ? 1.5 : a <= 26 ? 0.6 : a <= 29 ? 0 : a <= 31 ? -1.2 : a <= 33 ? -2.2 : -3.5;
  let d;
  if (base > 0) {
    d = base * (0.3 + 1.1 * Math.min(share, 1)) + gauss(0, 1.1) + 0.6 * l;
    const room = p.pot - p.ovr;
    d = room <= 0 ? Math.min(d, gauss(0, 0.5)) : Math.min(d, room + 0.4);
  } else {
    d = base + gauss(0, 0.9) + (base === 0 && share > 0.5 ? 0.3 : 0) + 0.3 * l;
  }
  p.ovr = clamp(round1(p.ovr + d), 35, 95);
  p.peak = Math.max(p.peak, Math.round(p.ovr));
}

function proceedSeason() {
  const last = S.history[S.history.length - 1];
  const nuGames = last.detail.fixtures.length || 50;
  const news = [];
  // development is based on the season just played (age during that season)
  for (const p of [...squad(), ...onLoan()]) {
    const row = p.seasons.filter(r => r.season === S.season).reduce((a, r) => a + r.mins, 0);
    const before = Math.round(p.ovr);
    develop(p, row / (nuGames * 90 * 0.7), last.luck ? (last.luck.value - 5) / 5 : 0);
    const after = Math.round(p.ovr);
    if (after - before >= 4) news.push(`<b>${esc(fullName(p))}</b> has developed fast: OVR ${before} → ${after}.`);
  }
  S.season++;
  const Y = S.season;
  S.window = { ins: [], outs: [], spent: 0, received: 0, budgetStart: 0 };
  // loans return
  for (const p of onLoan()) { logEvent(p, `Returned from loan at ${clubName(p.loan.club)}`); news.push(`<b>${esc(fullName(p))}</b> is back from loan at ${esc(clubName(p.loan.club))}.`); p.status = 'squad'; p.loan = null; }
  // retirements announced by players
  for (const p of squad()) {
    const a = age(p);
    let pr = 0;
    if (a >= 35) pr = 0.35 + (a - 35) * 0.2; else if (a >= 33 && p.ovr < 70) pr = 0.15;
    if (a >= 39) pr = 1;
    if (rand() < pr) { depart(p, 'Retired', null, 0); news.push(`<b>${esc(fullName(p))}</b> (${a}) has announced his retirement.`); }
  }
  // academy intake
  const nIntake = rint(1, 3), intake = [];
  for (let i = 0; i < nIntake; i++) {
    const pos = weightedKey({ GK: 1, RB: 1.2, CB: 2, LB: 1.2, DM: 1, CM: 2, AM: 1.5, RW: 1.2, LW: 1.2, ST: 2 });
    const a = rint(16, 17), ovr = rint(46, 60);
    const roll = rand(), pot = roll < 0.05 ? rint(84, 92) : roll < 0.3 ? rint(75, 84) : rint(62, 75);
    const p = makePlayer(pos, a, ovr, Math.max(pot, ovr + 6), weightedKey(ACADEMY_NAT_W));
    p.status = 'squad'; p.wage = rint(2, 4); p.contractEnd = Y + 2;
    p.joined = { season: Y, how: 'Academy' }; logEvent(p, 'Promoted from the academy');
    S.players[p.id] = p; intake.push(p);
  }
  news.push(`Academy intake: ${intake.map(p => `<b>${esc(fullName(p))}</b> (${p.pos}, ${age(p)})`).join(', ')}.`);
  // club strength drift
  for (const c of Object.values(S.clubs)) {
    const divMean = { PL: 77, CH: 67.5, L1: 59, L2: 53, NL: 47, EU: c.base }[c.div];
    const mean = c.div === 'EU' ? c.base : 0.6 * c.base + 0.4 * divMean;
    c.rating = round1(clamp(c.rating + 0.15 * (mean - c.rating) + gauss(0, 1.3), 50, 90));
  }
  // finances
  const carry = Math.max(0, S.budget) * 0.6;
  S.budget = Math.round(carry + last.income);
  let capChange = 0.03 + (S.nextEuro === 'UCL' ? 0.04 : S.nextEuro === 'UEL' ? 0.015 : 0);
  if (last.move === 'Relegated') capChange -= 0.22; if (last.move === 'Promoted') capChange += 0.15;
  S.wageCap = Math.round(S.wageCap * (1 + capChange));
  news.unshift(`The board has set a transfer budget of <b>${money(S.budget)}</b> (season income ${money(last.income)} + ${money(round1(carry))} carried over) and a wage cap of <b>${wageFmt(S.wageCap)}/week</b>.`);
  S.euro = S.nextEuro; S.nextEuro = null;
  if (last.move) news.unshift(`<b>${last.move}!</b> ${esc(myName())} will play in the ${DIV_NAME[nuDiv()]} in ${seasonLabel(Y)}.`);
  const expired = squad().filter(p => p.contractEnd < Y);
  if (expired.length) news.push(`Out of contract (renew or they leave for free): ${expired.map(p => `<b>${esc(fullName(p))}</b>`).join(', ')}.`);
  generateMarket();
  prepareWindow();
  S.news = news;
  S.phase = 'window';
}

function depart(p, how, club, fee) {
  p.status = 'left';
  p.left = { season: S.season, how, club: club || null, fee: fee || 0 };
  p.decision = null;
  const txt = how === 'Sold' ? `Sold to ${clubName(club)} for ${money(fee)}` : how;
  logEvent(p, txt);
  S.window.outs.push({ pid: p.id, how, club: club || null, fee: fee || 0 });
}

/* ---------------- transfer window ---------------- */
function clubPool(divs) { return Object.values(S.clubs).filter(c => divs.includes(c.div)); }
function pickClubNear(target, divs, spread = 2.5) { return weightedPick(clubPool(divs), c => Math.exp(-Math.abs(c.rating - target) / spread)).id; }
function prepareWindow() {
  for (const p of squad()) {
    p.decision = p.contractEnd < S.season ? 'leave' : 'keep';
    p.quote = p.contractEnd < S.season ? null : { club: pickClubNear(p.ovr + 1, ['PL', 'EU', 'CH']), fee: round1(marketValue(p) * rfloat(0.9, 1.2)) };
    // now and then a rich club makes an offer well above value
    if (p.quote && p.ovr >= 76 && rand() < 0.09) p.quote = { club: pickClubNear(Math.max(p.ovr + 4, 84), ['PL', 'EU'], 1.5), fee: round1(marketValue(p) * rfloat(1.4, 2.0)), big: true };
    p.loanClub = pickClubNear(p.ovr - 4, ['PL', 'CH', 'L1', 'EU'], 2);
    p.renewWage = renewalWage(p);
  }
  S.window.budgetStart = S.budget;
  if (S.settings && S.settings.autoFill) applyRecommendations();
}
function renewalWage(p) {
  const rows = p.seasons.filter(r => r.season === S.season - 1);
  const apps = rows.reduce((a, r) => a + r.apps, 0), avg = apps ? rows.reduce((a, r) => a + (r.avg || 0) * r.apps, 0) / apps : 0;
  const formF = avg >= 7.1 ? 1.2 : avg >= 6.85 ? 1.08 : 1;
  const market = wageFor(p.ovr, age(p)) * formF * rfloat(1.0, 1.1);
  // players under contract want a raise to sign early; veterans accept a cut
  const floor = age(p) >= 31 ? p.wage * 0.8 : p.contractEnd >= S.season ? p.wage * 1.05 : p.wage;
  return Math.round(Math.max(market, floor) * 2) / 2;
}
function generateMarket() {
  const base = nuStrength(); S.market = [];
  for (let i = 0; i < 42; i++) {
    const pos = i < 4 ? 'GK' : weightedKey(MARKET_POS_W);
    const free = rand() < 0.12;
    const a = free ? rint(26, 33) : clamp(Math.round(gauss(25, 3.6)), 18, 33);
    let ovr = clamp(round1(gauss(base - 3, 5.5) - (a <= 21 ? 3 : 0)), 58, 90);
    const p = makePlayer(pos, a, ovr);
    p.contractEnd = S.season + rint(0, 3);
    p.fromClub = free ? null : pickClubNear(ovr, ['PL', 'EU', 'CH']);
    p.ask = free ? 0 : round1(marketValue(p) * rfloat(1.05, 1.35));
    p.wageAsk = Math.round(wageFor(ovr, a) * rfloat(1.0, 1.2) * (free ? 1.25 : 1) * 2) / 2;
    p.years = a >= 31 ? 2 : a >= 29 ? 3 : rint(4, 5);
    S.market.push(p);
  }
}
const departing = d => ['sell', 'loan', 'release', 'retire', 'leave'].includes(d);
function windowProjection() {
  const sq = squad();
  const pendingSales = sq.filter(p => p.decision === 'sell').reduce((a, p) => a + p.quote.fee, 0);
  const staying = sq.filter(p => !departing(p.decision));
  const wages = staying.reduce((a, p) => a + (String(p.decision).startsWith('renew') ? p.renewWage : p.wage), 0);
  return { available: round1(S.budget + pendingSales), pendingSales, wages, size: staying.length, gks: staying.filter(p => p.pos === 'GK').length, staying };
}
function windowErrors() {
  const w = windowProjection(), e = [];
  if (w.available < 0) e.push(`Transfer budget is overspent by ${money(-w.available)}.`);
  if (w.wages > S.wageCap) e.push(`Wage bill ${wageFmt(w.wages)}/wk is over the cap of ${wageFmt(S.wageCap)}/wk.`);
  if (w.size < MIN_SQUAD) e.push(`Squad has ${w.size} players — you need at least ${MIN_SQUAD}.`);
  if (w.size > MAX_SQUAD) e.push(`Squad has ${w.size} players — the limit is ${MAX_SQUAD}.`);
  if (w.gks < 2) e.push(`You need at least 2 goalkeepers (you have ${w.gks}). Renew an out-of-contract keeper or sign one in Transfers.`);
  return e;
}
function buyPlayer(id) {
  const p = S.market.find(x => x.id === id); if (!p) return;
  const w = windowProjection();
  if (p.ask > w.available || w.wages + p.wageAsk > S.wageCap || w.size >= MAX_SQUAD) return;
  S.budget = round1(S.budget - p.ask);
  S.market = S.market.filter(x => x !== p);
  p.status = 'squad'; p.wage = p.wageAsk; p.contractEnd = S.season + p.years - 1;
  p.joined = { season: S.season, how: p.ask > 0 ? 'Transfer' : 'Free transfer', club: p.fromClub, fee: p.ask };
  logEvent(p, p.ask > 0 ? `Signed from ${clubName(p.fromClub)} for ${money(p.ask)}` : 'Signed as a free agent');
  p.decision = 'keep'; p.quote = { club: pickClubNear(p.ovr + 1, ['PL', 'EU', 'CH']), fee: round1(marketValue(p) * 0.85) };
  p.loanClub = pickClubNear(p.ovr - 4, ['PL', 'CH', 'L1', 'EU'], 2); p.renewWage = p.wage;
  S.players[p.id] = p;
  S.window.ins.push({ pid: p.id, club: p.fromClub, fee: p.ask });
  S.window.spent = round1(S.window.spent + p.ask);
}
function applyDecisions() {
  for (const p of squad()) {
    const d = p.decision || 'keep';
    if (d === 'sell') { S.budget = round1(S.budget + p.quote.fee); S.window.received = round1(S.window.received + p.quote.fee); depart(p, 'Sold', p.quote.club, p.quote.fee); }
    else if (d === 'loan') { p.status = 'loan'; p.loan = { club: p.loanClub, season: S.season }; logEvent(p, `Loaned to ${clubName(p.loanClub)}`); S.window.outs.push({ pid: p.id, how: 'Loan', club: p.loanClub, fee: 0 }); }
    else if (d === 'release') depart(p, 'Released', null, 0);
    else if (d === 'retire') depart(p, 'Retired', null, 0);
    else if (d === 'leave') depart(p, 'Contract expired', null, 0);
    else if (d.startsWith('renew')) { const n = +d.slice(5); p.contractEnd = S.season + n - 1; p.wage = p.renewWage; logEvent(p, `Signed a ${n}-year contract (${wageFmt(p.wage)}/wk)`); }

}
function wageBill() { return squad().reduce((a, p) => a + p.wage, 0); }

/* ---------------- new game / persistence ---------------- */
function newGame(fresh = false, club = 'Newcastle United') {
  USED_NAMES.clear();
  const start = clubStart(club);
  S = { v: 1, my: { name: club }, season: START_YEAR, phase: 'window', nextId: 1, clubs: {}, divisions: { PL: [NU], CH: [], L1: [], L2: [], NL: [] }, players: {}, market: [],
    settings: { luck: 'random', autoFill: false, formation: '4-3-3' }, lineups: {}, budget: start.budget, wageCap: 0, euro: start.euro, nextEuro: null, lastPLOrder: [], history: [], news: [], window: { ins: [], outs: [], spent: 0, received: 0, budgetStart: start.budget } };
  const add = (name, r, div, country) => { const id = slug(name); S.clubs[id] = { id, name, rating: r, base: r, div, country, bias: round1(clamp(gauss(0, 1.3), -2.5, 2.5)) }; if (div !== 'EU') S.divisions[div].push(id); };
  PL_CLUBS.forEach(([n, r]) => add(n, r, 'PL', 'ENG'));
  CH_CLUBS.forEach(([n, r]) => add(n, r, 'CH', 'ENG'));
  L1_CLUBS.forEach(([n, r]) => add(n, r, 'L1', 'ENG'));
  L2_CLUBS.forEach(([n, r]) => add(n, r, 'L2', 'ENG'));
  NL_CLUBS.forEach(([n, r]) => add(n, r, 'NL', 'ENG'));
  EU_CLUBS.forEach(([n, c, r]) => add(n, r, 'EU', c));
  // the club you manage is the special id NU; its real-world entry leaves the AI pool
  const mine = slug(club);
  delete S.clubs[mine];
  S.divisions.PL = S.divisions.PL.filter(id => id !== mine);
  // squad level follows the club's standing (the template squad is built for an 80-rated side)
  const lvl = start.r - 80;
  INITIAL_SQUAD.forEach(([pos, ovr, a]) => {
    const p = makePlayer(pos, a, ovr + lvl + rint(-1, 1));
    p.status = 'squad';
    p.contractEnd = START_YEAR + (a >= 31 ? rint(0, 1) : a <= 20 ? rint(1, 3) : rint(1, 4));
    p.wage = Math.round(wageFor(p.ovr, a) * rfloat(0.85, 1.15) * 2) / 2;
    p.joined = { season: START_YEAR, how: 'Founding squad' };
    S.players[p.id] = p;
  });
  S.wageCap = Math.ceil(wageBill() * 1.12 / 10) * 10;
  S.lastPLOrder = LAST_TABLE.map(n => n === club ? NU : slug(n));
  generateMarket();
  prepareWindow();
  S.news = [
    `Welcome to ${esc(myInfo().stadium)}. It's the summer of ${START_YEAR}: ${start.promoted ? `${esc(club)} are back in the Premier League after <b>promotion from the Championship</b>.` : `${esc(club)} finished <b>${ordinal(start.pos)}</b> last season${start.euro ? ` and qualified for the <b>${EURO_NAME[start.euro]}</b>` : ', outside the European places'}.`} Board expectation: <b>${start.tag}</b>.`,
    `The board has set a transfer budget of <b>${money(S.budget)}</b> and a wage cap of <b>${wageFmt(S.wageCap)}/week</b>.`,
    `Set a decision for each player in the squad, sign players in the Transfers tab, then press <b>Play season</b>.`
  ];
  UI.tab = 'squad'; UI.viewSeason = null; UI.bxiSeason = null; UI.bxiForm = null; UI.bxiMode = null; UI.planSlot = null; UI.modal = null; UI.posFilter = 'All'; UI.picker = false;
  if (fresh) S.savedAt = 0; else save();
}

/* Saving: always to this browser; also to the viewer's private claude.ai storage when the page
   runs as a published artifact. The save is split across documents (each is capped at 256 KiB)
   and written to alternating generations so an interrupted save never corrupts the last good one. */
const Cloud = { db: null, uid: null, status: 'local', gen: null, next: null, busy: false, timer: null };
const CHUNK = 90000;
function save() {
  if (!S) return;
  S.savedAt = Date.now();
  let json; try { json = JSON.stringify(S); } catch (e) { return; }
  try { localStorage.setItem(SAVE_KEY, json); } catch (e) { /* storage unavailable */ }
  if (!Cloud.db) return;
  Cloud.next = json;
  clearTimeout(Cloud.timer);
  Cloud.timer = setTimeout(flushCloud, 1200);
}
async function flushCloud() {
  if (Cloud.busy || !Cloud.next) return;
  Cloud.busy = true;
  while (Cloud.next) {
    const json = Cloud.next; Cloud.next = null;
    try {
      const col = Cloud.db.collection('data/users/' + Cloud.uid);
      const gen = Cloud.gen === 'a' ? 'b' : 'a';
      const n = Math.ceil(json.length / CHUNK);
      for (let i = 0; i < n; i++) await col.doc(`${gen}-${i}`).set({ s: json.slice(i * CHUNK, (i + 1) * CHUNK) });
      await col.doc('meta').set({ gen, chunks: n, savedAt: S.savedAt, season: S.season, v: 1 });
      Cloud.gen = gen; Cloud.status = 'cloud';
    } catch (e) {
      Cloud.status = 'error';
      if (e && ['invalid_argument', 'revoked', 'not_granted', 'capability_disabled', 'capability_removed'].includes(e.code)) { Cloud.db = null; Cloud.next = null; }
    }
  }
  Cloud.busy = false;
  updateSaveStatus();
}
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), ms))]);
async function cloudInit() {

  try { [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch (e) { return; }
  if (!db || !user) { updateSaveStatus(); return; }
  let uid = null; try { uid = await user.id(); } catch (e) { /* signed out */ }

/* ---------------- recommendation engine ----------------
   Rates every player against the current best XI, last season's form, age, potential,
   contract and the offer on the table, then checks the whole plan still leaves a legal,
   affordable squad (21+ players, 2+ goalkeepers, under the wage cap). */
function recommend() {
  const sq = squad(), recs = {};
  if (!sq.length) return recs;
  const { xi } = planXI(sq);
  const xiIds = new Set(xi.map(x => x.p.id));
  const xiAvg = xi.reduce((a, x) => a + x.p.ovr, 0) / xi.length;
  const prev = S.season - 1;
  // positional cover: the top N players able to play each position are "needed" there
  const fc = {}; formTypes().forEach(t => fc[t] = (fc[t] || 0) + 1);
  const NEED_POS = {}; POS_ORDER.forEach(t => NEED_POS[t] = t === 'GK' ? 3 : !fc[t] ? 0 : fc[t] === 1 ? 2 : fc[t] + 2);
  const cover = {};
  for (const pos of POS_ORDER) {
    sq.filter(p => posList(p).includes(pos)).sort((a, b) => b.ovr * fitP(b, pos) - a.ovr * fitP(a, pos))
      .slice(0, NEED_POS[pos]).forEach(p => (cover[p.id] = cover[p.id] || []).push(pos));
  }
  const form = p => {
    const rows = p.seasons.filter(r => r.season === prev);
    const apps = rows.reduce((a, r) => a + r.apps, 0), mins = rows.reduce((a, r) => a + r.mins, 0);
    const rs = rows.reduce((a, r) => a + (r.avg || 0) * r.apps, 0);
    return { played: rows.length > 0, apps, mins, avg: apps ? rs / apps : null, ovrThen: rows.length ? rows[0].ovr : null };
  };
  for (const p of sq) {
    const a = age(p), yrs = p.contractEnd - S.season, f = form(p), val = marketValue(p);
    const key = xiIds.has(p.id);
    const prospect = a <= 22 && p.pot >= xiAvg - 1;
    const rotation = !key && p.ovr >= xiAvg - 5;
    const covers = cover[p.id] || [];
    const starForm = f.apps >= 15 && f.avg >= 7.0;
    const poorForm = f.apps >= 10 && f.avg !== null && f.avg < 6.35;
    const breakout = f.ovrThen !== null && p.ovr - f.ovrThen >= 3;
    const fee = p.quote ? p.quote.fee : 0, offer = fee / Math.max(val, 0.1);
    const big = p.quote && p.quote.big;
    // renew for n seasons from now, always extending the current deal
    const renew = target => 'renew' + clamp(Math.max(target, yrs + 2), 1, 5);
    const idealYrs = a <= 23 ? 5 : a <= 27 ? 4 : a <= 30 ? 3 : a <= 32 ? 2 : 1;
    const sellOr = (why, fallback = 'release') => fee >= 0.3 ? ['sell', why] : [fallback, why];
    let d = 'keep', why = '';
    const set = ([dd, ww]) => { d = dd; why = ww; };
    if (p.joined.season === S.season && p.joined.how !== 'Academy' && p.joined.how !== 'Founding squad') set(['keep', 'New signing']);
    else if (yrs < 0) {
      if ((key || starForm || rotation || covers.length) && a <= 33) set([renew(Math.min(idealYrs, 3)), key ? 'Starter out of contract' : covers.length ? `Out of contract, needed at ${covers[0]}` : 'Useful squad player, out of contract']);
      else if (prospect) set([renew(3), 'Promising youngster, out of contract']);
      else set(['leave', a >= 33 ? 'Out of contract and ageing' : 'Out of contract and not needed']);
    }
    else if (a >= 34 && !key && !starForm) set(['retire', `Declining at ${a}`]);
    else if (key || starForm) {
      if (big && offer >= 1.4 && (a >= 28 || offer >= 1.7)) set(['sell', `Big offer: ${offer.toFixed(1)}× his value`]);
      else if (yrs <= 1 && a <= 30) set([renew(idealYrs), yrs === 0 ? 'Key player in his final year' : starForm ? `Extend early after a strong season (${f.avg.toFixed(1)} avg)` : 'Extend early: key player with 2 years left']);
      else if (yrs === 0 && a <= 33) set([renew(1), 'Veteran starter: one-year extension']);
      else if (yrs === 2 && a <= 25 && (starForm || breakout)) set([renew(5), 'Lock in a rising star']);
      else set(['keep', starForm && !key ? `Strong form (${f.avg.toFixed(1)} avg)` : 'Key starter']);
    }
    else if (a <= 17) set(['keep', 'Academy player, too young to loan']);
    else if (prospect && a <= 21 && p.ovr < xiAvg - 4 && f.mins < 1500) set(yrs === 0 ? [renew(4), 'Prospect: extend his deal first'] : ['loan', 'Prospect who needs minutes']);
    else if (prospect) set(yrs <= 1 ? [renew(5), breakout ? 'Breakout year: extend early' : 'Promising: extend before his deal runs down'] : ['keep', 'Promising youngster']);
    else if (poorForm && !(covers.includes('GK'))) set(a <= 24 ? ['loan', `Poor form last season (${f.avg.toFixed(1)} avg)`] : sellOr(`Poor form last season (${f.avg.toFixed(1)} avg)`));
    else if (big && offer >= 1.4) set(['sell', `Big offer for a squad player (${offer.toFixed(1)}×)`]);
    else if (rotation || covers.length) {
      const role = covers.length ? `Cover at ${covers.join('/')}` : 'Squad rotation';
      if (yrs === 0) set(a <= 29 ? [renew(2), `${role}: extend before he leaves for free`] : sellOr('Final year: sell now or lose him for free', 'keep'));
      else if (yrs === 1 && a >= 30 && !covers.length) set(sellOr('Past his peak with 2 years left: sell while he has value', 'keep'));
      else set(['keep', role]);
    }
    else if (a <= 23 && yrs >= 1) set(['loan', 'Fringe player: loan for experience']);
    else set(sellOr(yrs === 0 ? 'Final year and not needed: sell now' : 'Surplus to requirements'));
    recs[p.id] = { d, why };
  }
  // keep the squad legal: at least 21 players and 2 goalkeepers
  const staying = () => sq.filter(p => !departing(recs[p.id].d));
  for (let guard = 0; guard < 40; guard++) {
    const st = staying(), gks = st.filter(p => p.pos === 'GK').length;
    if (st.length >= 21 && gks >= 2) break;
    const pool = sq.filter(p => departing(recs[p.id].d) && !(recs[p.id].d === 'retire' && age(p) >= 36) && (gks < 2 ? p.pos === 'GK' : true)).sort((x, y) => y.ovr - x.ovr);
    if (!pool.length) break;
    const p = pool[0];
    recs[p.id] = { d: p.contractEnd < S.season ? 'renew1' : 'keep', why: gks < 2 ? 'Needed as goalkeeper cover' : 'Needed for squad depth' };
  }
  // keep under the wage cap by moving on expensive non-starters
  const wageOf = p => recs[p.id].d.startsWith('renew') ? p.renewWage : p.wage;
  let wages = staying().reduce((a, p) => a + wageOf(p), 0);
  const gkCount = () => staying().filter(p => p.pos === 'GK').length;
  const trim = (cands, floor, action, why) => {
    for (const p of cands) {
      if (wages <= S.wageCap || staying().length <= floor) return;
      if (p.pos === 'GK' && gkCount() <= 2) continue;
      wages -= wageOf(p);
      recs[p.id] = { d: action(p), why };
    }
  };
  const byWage = list => list.sort((x, y) => wageOf(y) - wageOf(x));
  const notProspect = p => !(age(p) <= 22 && p.pot >= xiAvg - 1);
  // 1) sell expensive non-starters, 2) don't renew non-starters, 3) sell the oldest high earners in the XI
  trim(byWage(staying().filter(p => !xiIds.has(p.id) && p.contractEnd >= S.season && notProspect(p))), 20, () => 'sell', 'Over the wage cap: sell to free up wages');
  trim(byWage(staying().filter(p => !xiIds.has(p.id) && p.contractEnd < S.season)), 20, () => 'leave', 'Over the wage cap: let his contract run out');
  trim(staying().filter(p => xiIds.has(p.id) && age(p) >= 29).sort((x, y) => (age(y) - age(x)) || (wageOf(y) - wageOf(x))), 19, p => p.contractEnd < S.season ? 'leave' : 'sell', 'Over the wage cap: cash in on an ageing starter');
  trim(byWage(staying().filter(p => !xiIds.has(p.id))), 18, p => p.contractEnd < S.season ? 'leave' : 'release', 'Over the wage cap: release to free up wages');
  return recs;
}
function applyRecommendations() { const recs = recommend(); for (const p of squad()) if (recs[p.id]) p.decision = recs[p.id].d; }

    <div class="shape">${units.map(([k, l]) => `<div class="unit ${k === weakest ? 'weak' : ''}"><div class="k">${l}${k === weakest ? ' · weakest' : ''}</div><div class="v">${u[k].toFixed(1)}</div><div class="d">${names(k)}</div></div>`).join('')}</div>

function renderSquad() {

      { k: 'name', l: 'Name', cls: 'name', f: r => `<a href="#" data-action="player" data-id="${r.p.id}">${esc(r.name)}</a>${r.p.joined.season === S.season && r.p.joined.how !== 'Founding squad' ? ` <span class="tag">${r.p.joined.how === 'Academy' ? 'Academy' : 'New'}</span>` : ''}` },
      { k: 'nat', l: 'Nat', f: r => r.p.nat, sv: r => r.p.nat },
      { k: 'age', l: 'Age', n: 1 },
      { k: 'ovr', l: 'OVR', n: 1, f: r => `<b>${Math.round(r.ovr)}</b>`, title: 'Overall rating' },
      { k: 'pot', l: 'Pot.', n: 1, f: r => potLabel(r.p), sv: r => r.p.pot, title: 'Scouted potential range (players 24 and under)' },
      { k: 'value', l: 'Value', n: 1, f: r => money(r.value) },
      { k: 'wage', l: 'Wage/wk', n: 1, f: r => wageFmt(r.wage) },
      { k: 'con', l: 'Contract', f: r => contractCell(r.p) },
      { k: 'apps', l: `Apps ${seasonAscii(prev).slice(2)}`, n: 1, f: r => r.apps == null ? '<span class="muted">—</span>' : r.apps + (r.loanTag ? '<span class="muted small"> (loan)</span>' : ''), title: 'Last season (incl. loans)' },
      { k: 'goals', l: 'G', n: 1, f: r => r.goals ?? '' },
      { k: 'assists', l: 'A', n: 1, f: r => r.assists ?? '' },
      { k: 'avg', l: 'Avg', n: 1, f: r => r.avg == null ? '' : fmtAvg(r.avg) },
      { k: 'adv', l: 'Recommended', sort: false, f: r => { const x = recs[r.p.id]; return x ? `<div class="adv adv-${decClass(x.d)} ${x.d === r.p.decision ? 'match' : ''}"><b>${esc(decShort(x.d))}</b><span>${esc(x.why)}</span></div>` : ''; } },
      { k: 'dec', l: 'Decision', sort: false, f: r => { const opts = decisionOptions(r.p); const cur = opts.find(o => o[0] === r.p.decision); return `<select id="dec-${r.p.id}" class="dec ${r.p.decision !== (r.p.contractEnd < S.season ? 'leave' : 'keep') ? 'changed' : ''}" data-change="decide" data-id="${r.p.id}" title="${esc(cur ? cur[1] : '')}" aria-label="Decision for ${esc(r.name)}">${opts.map(([v, l]) => `<option value="${v}" ${r.p.decision === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`; } },
    ];
    const differ = squad().filter(p => recs[p.id] && recs[p.id].d !== p.decision).length;
    html += `<div class="card"><div class="row between"><h2 style="margin:0">Squad for ${seasonLabel(S.season)}</h2><span class="muted small">Decisions take effect when you press Play season. Click a name for the player's history.</span></div>
      <div class="toolbar">
        <button class="btn btn-sm btn-primary" data-action="apply-recs" ${differ ? '' : 'disabled'}>Use all recommendations${differ ? ` (${differ} change${differ > 1 ? 's' : ''})` : ''}</button>
        <button class="btn btn-sm" data-action="reset-decs">Reset all to Keep</button>
        <span class="spacer"></span>
        <label for="autofill"><input type="checkbox" id="autofill" data-change="autofill" ${S.settings.autoFill ? 'checked' : ''}> Pre-fill recommendations every summer</label>
      </div>
      ${table('squadW', cols, rows, { def: { k: 'pos', d: 'asc' }, rowClass: r => departing(r.p.decision) ? 'muted' : '' })}</div>`;
  } else {
    const Y = S.season;
    const rows = squad().map(p => { const r = lastRow(p, Y).find(x => !x.loan) || {}; return { p, pos: p.pos, name: fullName(p), age: age(p), ovr: p.ovr, ...r }; });
    const tot = rows.reduce((a, r) => { ['apps', 'mins', 'goals', 'assists', 'yc', 'rc', 'potm'].forEach(k => a[k] += r[k] || 0); return a; }, { apps: 0, mins: 0, goals: 0, assists: 0, yc: 0, rc: 0, potm: 0 });
    const h = S.history[S.history.length - 1];
    const ogs = h.detail.fixtures.reduce((a, f) => a + (f.sc.match(/OG/g) ? (f.sc.split(';').filter(s => s.trim().startsWith('OG'))[0] || '').split(',').length : 0), 0);
    const cols = [
      { k: 'pos', l: 'Pos', f: r => posCell(r.p), sv: r => posSort(r.p) },
      { k: 'name', l: 'Name', cls: 'name', f: r => `<a href="#" data-action="player" data-id="${r.p.id}">${esc(r.name)}</a>` },
      { k: 'age', l: 'Age', n: 1 },
      { k: 'ovr', l: 'OVR', n: 1, f: r => `<b>${Math.round(r.ovr)}</b>` },
      { k: 'apps', l: 'Apps', n: 1, f: r => `${r.starts ?? 0}${r.subs ? ` <span class="muted">(${r.subs})</span>` : ''}`, title: 'Starts (sub appearances)' },
      { k: 'mins', l: 'Mins', n: 1, f: r => (r.mins || 0).toLocaleString() },
      { k: 'goals', l: 'Goals', n: 1 }, { k: 'assists', l: 'Assists', n: 1 },
      { k: 'yc', l: 'YC', n: 1 }, { k: 'rc', l: 'RC', n: 1 },
      { k: 'avg', l: 'Avg rating', n: 1, f: r => fmtAvg(r.avg) },
      { k: 'potm', l: 'POTM', n: 1, title: 'Player of the Match awards' },
      { k: 'played', l: 'Played at', sort: false, f: r => `<span class="muted small">${playedStr(r.posPlayed)}</span>`, title: 'Appearances by position this season' },
      { k: 'injured', l: 'Inj.', n: 1, f: r => r.injured ? `<span class="tag inj">${r.injured} games</span>` : '', title: 'Matches missed through injury' },
    ];
    html += `<div class="card"><div class="row between"><h2 style="margin:0">${seasonLabel(Y)} squad stats · all competitions</h2><span class="muted small">${h.detail.fixtures.length} matches · ${h.GF + sumCupGoals(h)} goals scored${ogs ? ` (${ogs} own goals)` : ''}</span></div><div style="height:12px"></div>
      ${table('squadR', cols, rows, { def: { k: 'pos', d: 'asc' }, foot: `<td></td><td>Team total</td><td></td><td></td><td class="n">${tot.apps}</td><td class="n">${tot.mins.toLocaleString()}</td><td class="n">${tot.goals}</td><td class="n">${tot.assists}</td><td class="n">${tot.yc}</td><td class="n">${tot.rc}</td><td></td><td class="n">${tot.potm}</td><td></td><td></td>` })}</div>`;
    const loans = onLoan().map(p => ({ p, name: fullName(p), pos: p.pos, age: age(p), ovr: p.ovr, ...(lastRow(p, Y).find(x => x.loan) || {}) }));
    if (loans.length) {
      html += `<div class="card"><h2>Out on loan</h2>${table('loans', [
        { k: 'pos', l: 'Pos', f: r => posBadge(r.pos) }, { k: 'name', l: 'Name', cls: 'name', f: r => `<a href="#" data-action="player" data-id="${r.p.id}">${esc(r.name)}</a>` },
        { k: 'club', l: 'Club', f: r => esc(clubName(r.club)) }, { k: 'age', l: 'Age', n: 1 }, { k: 'apps', l: 'Apps', n: 1 }, { k: 'goals', l: 'Goals', n: 1 }, { k: 'assists', l: 'Assists', n: 1 }, { k: 'avg', l: 'Avg', n: 1, f: r => fmtAvg(r.avg) }], loans)}</div>`;
    }
  }
  return html;
}
function sumCupGoals(h) { return h.detail.fixtures.filter(f => !LEAGUE_CODES.includes(f.comp)).reduce((a, f) => a + f.gf, 0); }

/* ---------------- transfers tab ---------------- */
function renderTransfers() {
  if (S.phase !== 'window') {
    const h = S.history[S.history.length - 1];
    return `<div class="card"><div class="empty">The transfer window is closed. It reopens when you start ${seasonLabel(S.season + 1)}.</div></div>` + transferSummary(h.transfers, h.label);
  }
  const w = windowProjection();
  const filters = ['All', 'GK', 'DEF', 'MID', 'ATT'];
  const f = UI.posFilter;
  const list = S.market.filter(p => f === 'All' || (POS_ORDER.includes(f) ? posList(p).includes(f) : POS_GROUP[p.pos] === f));
  // how each target compares with your planned starter at the positions he can play in your formation
  const key = S.settings.formation, plan = planXI(w.staying, key).xi;
  const starterAt = {}; plan.forEach(x => starterAt[x.slot] = Math.min(starterAt[x.slot] ?? 99, x.eff));
  const upgrade = p => {
    let best = null;
    posList(p).forEach(t => { if (starterAt[t] == null) return; const d = effAt(p, t) - starterAt[t]; if (!best || d > best.d) best = { t, d }; });
    return best;
  };
  const cols = [
    { k: 'pos', l: 'Pos', f: p => posCell(p), sv: p => posSort(p) },
    { k: 'name', l: 'Name', cls: 'name', f: p => esc(fullName(p)), sv: p => fullName(p) },
    { k: 'nat', l: 'Nat' },
    { k: 'age', l: 'Age', n: 1, f: p => age(p), sv: p => age(p) },
    { k: 'ovr', l: 'OVR', n: 1, f: p => `<b>${Math.round(p.ovr)}</b>` },
    { k: 'pot', l: 'Pot.', n: 1, f: p => potLabel(p) },
    { k: 'upg', l: 'vs your XI', sv: p => (upgrade(p) || { d: -99 }).d, title: 'Compared with your planned starter at his best position in your formation', f: p => {
      const u = upgrade(p); if (!u) return '<span class="muted small">No slot in your shape</span>';
      const d = Math.round(u.d);
      return d >= 1 ? `<span class="tag" style="color:var(--win)">Starts at ${u.t} +${d}</span>` : d >= -3 ? `<span class="tag">Rotation at ${u.t} (${d})</span>` : `<span class="muted small">Backup at ${u.t} (${d})</span>`; } },
    { k: 'club', l: 'Club', f: p => p.fromClub ? esc(clubName(p.fromClub)) : '<span class="tag">Free agent</span>', sv: p => p.fromClub ? clubName(p.fromClub) : '' },
    { k: 'ask', l: 'Fee', n: 1, f: p => p.ask ? money(p.ask) : 'Free' },
    { k: 'wageAsk', l: 'Wage/wk', n: 1, f: p => wageFmt(p.wageAsk) },
    { k: 'years', l: 'Contract', n: 1, f: p => `${p.years} yrs` },
    { k: 'buy', l: '', sort: false, f: p => {
      const why = p.ask > w.available ? 'Not enough budget' : w.wages + p.wageAsk > S.wageCap ? 'Over the wage cap' : w.size >= MAX_SQUAD ? 'Squad full' : '';
      return `<button class="btn btn-sm ${why ? '' : 'btn-primary'}" data-action="buy" data-id="${p.id}" ${why ? `disabled title="${why}"` : ''}>${why || 'Sign'}</button>`; } },
  ];
  return `<div class="card"><div class="row between"><h2 style="margin:0">Transfer market</h2><span class="muted small">Available: <b>${money(w.available)}</b> · wage room: <b>${wageFmt(Math.max(0, S.wageCap - w.wages))}/wk</b> · squad ${w.size}/${MAX_SQUAD}</span></div>
    <div style="height:12px"></div>
    <div class="chips">${filters.map(x => `<button class="chip ${f === x ? 'on' : ''}" data-action="posf" data-v="${x}">${x === 'All' ? 'All positions' : x === 'DEF' ? 'Defenders' : x === 'MID' ? 'Midfielders' : x === 'ATT' ? 'Attackers' : 'Goalkeepers'}</button>`).join('')}</div>
    <div class="chips sub">${POS_ORDER.filter(t => t !== 'GK').map(t => `<button class="chip ${f === t ? 'on' : ''}" data-action="posf" data-v="${t}">${t}</button>`).join('')}<span class="muted small" style="align-self:center">Sort by “vs your XI” to see who would start.</span></div>
    ${table('market', cols, list, { def: { k: 'ovr', d: 'desc' } })}
    <p class="muted small">Signings are immediate. Sales and loans are set from the Squad tab and complete when the season starts, but sale fees already count toward your budget.</p></div>`
    + transferSummary(S.window, seasonLabel(S.season), true);
}
function transferSummary(t, label, live) {
  const ins = t.ins.map(x => ({ name: fullName(S.players[x.pid]), id: x.pid, pos: S.players[x.pid].pos, club: x.club ? clubName(x.club) : 'Free agent', fee: x.fee }));
  let outs = t.outs.map(x => ({ name: fullName(S.players[x.pid]), id: x.pid, pos: S.players[x.pid].pos, how: x.how, club: x.club ? clubName(x.club) : '—', fee: x.fee }));
  if (live) squad().filter(p => departing(p.decision)).forEach(p => outs.push({ name: fullName(p), id: p.id, pos: p.pos, how: { sell: 'Sale (pending)', loan: 'Loan (pending)', release: 'Release (pending)', retire: 'Retire (pending)', leave: 'Contract expiring' }[p.decision], club: p.decision === 'sell' ? clubName(p.quote.club) : p.decision === 'loan' ? clubName(p.loanClub) : '—', fee: p.decision === 'sell' ? p.quote.fee : 0 }));
  const c1 = [{ k: 'pos', l: 'Pos', f: r => posBadge(r.pos) }, { k: 'name', l: 'Player', cls: 'name', f: r => `<a href="#" data-action="player" data-id="${r.id}">${esc(r.name)}</a>` }, { k: 'club', l: 'From' }, { k: 'fee', l: 'Fee', n: 1, f: r => r.fee ? money(r.fee) : 'Free' }];
  const c2 = [{ k: 'pos', l: 'Pos', f: r => posBadge(r.pos) }, { k: 'name', l: 'Player', cls: 'name', f: r => `<a href="#" data-action="player" data-id="${r.id}">${esc(r.name)}</a>` }, { k: 'how', l: 'Type' }, { k: 'club', l: 'To' }, { k: 'fee', l: 'Fee', n: 1, f: r => r.fee ? money(r.fee) : '—' }];
  return `<div class="grid c2"><div class="card"><h2>Arrivals · summer ${label.slice(0, 4)}</h2>${table('ins', c1, ins, { nosort: true })}</div><div class="card"><h2>Departures · summer ${label.slice(0, 4)}</h2>${table('outs', c2, outs, { nosort: true })}</div></div>`;
}

/* ---------------- season tab ---------------- */
function renderSeason() {
  if (!S.history.length) return `<div class="card"><div class="empty">No seasons played yet. Set up your squad, then press <b>Play ${seasonLabel(S.season)} season</b>.</div></div>`;
  const y = UI.viewSeason ?? S.history[S.history.length - 1].season;
  const h = S.history.find(x => x.season === y) || S.history[S.history.length - 1];
  const d = h.detail;
  const sel = `<select id="season-select" class="seasonsel" data-change="viewseason" aria-label="Season">${S.history.slice().reverse().map(x => `<option value="${x.season}" ${x.season === h.season ? 'selected' : ''}>${x.label}</option>`).join('')}</select>`;
  const kpi = (k, v, dsc, gold) => `<div class="kpi"><div class="k">${k}</div><div class="v ${gold ? 'gold' : ''}">${v}</div>${dsc ? `<div class="d">${dsc}</div>` : ''}</div>`;
  let html = `<div class="row between" style="margin-bottom:12px"><h2 style="margin:0;font-size:26px">${h.label} season review</h2><div class="row"><span class="muted small">Season</span>${sel}</div></div>`;
  html += `<div class="kpis">
    ${kpi(DIV_NAME[h.div], ordinal(h.pos), `${h.W}W ${h.D}D ${h.L}L · ${h.Pts} pts${h.move ? ` · <b>${h.move}</b>` : ''}`, h.pos === 1)}
    ${kpi('FA Cup', h.fa || '—', h.fa === 'Winners' ? '' : `Won by ${esc(h.champions.FA)}`, h.fa === 'Winners')}
    ${kpi('League Cup', h.lc || '—', h.lc === 'Winners' ? '' : `Won by ${esc(h.champions.LC)}`, h.lc === 'Winners')}
    ${h.euro ? kpi(h.euro.name, h.euro.result === 'League phase' ? `League phase (${ordinal(h.euro.leaguePos)})` : h.euro.result, h.euro.result === 'Winners' ? '' : `Won by ${esc(h.champions.euro)}`, h.euro.result === 'Winners') : kpi('Europe', '—', 'Did not qualify')}
    ${kpi('Next season', h.nextEuro ? EURO_NAME[h.nextEuro] : 'No Europe', h.div === 'PL' && h.pos !== 1 ? `PL champions: ${esc(h.champions.PL)}` : '')}
    ${h.luck ? kpi('Luck', `${h.luck.value}/10 ${luckBar(h.luck.value)}`, `${LUCK_LABELS[h.luck.value]} · ${h.luck.mode === 'random' ? 'rolled at random' : 'set by you'}`) : ''}
    ${h.streaks ? kpi('Best league runs', `${h.streaks.unbeaten} unbeaten`, `${h.streaks.wins} wins in a row${h.L === 0 ? ' · <b>Invincibles!</b>' : ''} · ${h.injuries} games lost to injury`) : ''}
  </div>`;
  html += `<div class="card"><h2>Trophies</h2>${h.trophies.length ? `<div class="trophies">${h.trophies.map(t => `<span class="trophy">🏆 ${esc(t)}</span>`).join('')}</div>` : '<span class="muted">No trophies this season.</span>'}
    <h3>Awards</h3>${awardsHtml(h)}</div>`;
  // league table
  const zone = r => {
    const i = d.table.findIndex(x => x.id === r.id) + 1;
    if (h.div === 'PL') return (r.id === NU ? 'nu ' : '') + (i <= 4 ? 'zone-ucl' : i === 5 ? 'zone-uel' : i === 6 ? 'zone-uecl' : i > d.table.length - 3 ? 'zone-rel' : '');
    const rule = DIV_RULES[h.div];
    return (r.id === NU ? 'nu ' : '') + (i <= rule.auto ? 'zone-uecl' : rule.po && i <= rule.po[1] ? 'zone-uel' : rule.down && i > d.table.length - rule.down ? 'zone-rel' : '');
  };
  const lt = d.table.map((r, i) => ({ ...r, pos: i + 1, GD: r.GF - r.GA }));
  const tcols = [{ k: 'pos', l: '#', n: 1 }, { k: 'name', l: 'Club', cls: 'name' }, { k: 'P', l: 'P', n: 1 }, { k: 'W', l: 'W', n: 1 }, { k: 'D', l: 'D', n: 1 }, { k: 'L', l: 'L', n: 1 }, { k: 'GF', l: 'GF', n: 1 }, { k: 'GA', l: 'GA', n: 1 }, { k: 'GD', l: 'GD', n: 1, f: r => (r.GD > 0 ? '+' : '') + r.GD }, { k: 'Pts', l: 'Pts', n: 1, f: r => `<b>${r.Pts}</b>` }];
  const legend = h.div === 'PL' ? `<div class="legend"><span><i style="background:var(--ucl)"></i>Champions League</span><span><i style="background:var(--uel)"></i>Europa League</span><span><i style="background:var(--uecl)"></i>Conference League</span><span><i style="background:var(--rel)"></i>Relegated</span></div>`
    : `<div class="legend"><span><i style="background:var(--uecl)"></i>Promoted</span><span><i style="background:var(--uel)"></i>Play-offs</span>${DIV_RULES[h.div].down ? '<span><i style="background:var(--rel)"></i>Relegated</span>' : '<span>Lowest tier in the game: no relegation</span>'}</div>`;
  html += `<div class="grid c2"><div class="card"><h2>${DIV_NAME[h.div]} table</h2>${table('lt', tcols, lt, { nosort: true, rowClass: zone })}${legend}</div><div>`;
  const pathCard = (title, path, exit) => `<div class="card"><h2>${title}${exit ? ` · <span class="muted">${esc(exit)}</span>` : ''}</h2>${path.length ? table('p' + title, [
      { k: 'label', l: 'Round' }, { k: 'opp', l: 'Opponent', f: r => esc(clubName(r.opp)) }, { k: 'venue', l: '', f: r => r.venue }, { k: 'score', l: 'Score', f: r => esc(r.score) },
      { k: 'won', l: '', f: r => r.won === true ? '<span class="tag" style="color:var(--win)">Through</span>' : r.won === false ? '<span class="tag" style="color:var(--loss)">Out</span>' : '' }], path, { nosort: true }) : '<span class="muted">Did not take part.</span>'}</div>`;
  if (h.euro) html += pathCard(h.euro.name, d.euroPath, h.euro.result);
  html += pathCard('FA Cup', d.faPath, h.fa);
  html += pathCard('League Cup', d.lcPath, h.lc);
  if (d.poPath && d.poPath.length) html += pathCard('Play-offs', d.poPath, null);
  html += `</div></div>`;
  // fixtures
  const comps = [['all', 'All'], ['league', 'League'], ['FA', 'FA Cup'], ['LC', 'League Cup'], ['euro', 'Europe']];
  const fx = d.fixtures.filter(f => UI.fixFilter === 'all' || (UI.fixFilter === 'league' ? LEAGUE_CODES.includes(f.comp) || f.comp === 'PO' : UI.fixFilter === 'euro' ? !!EURO_RANK[f.comp] : f.comp === UI.fixFilter));
  const res = f => f.pens ? (f.pens[0] > f.pens[1] ? 'W' : 'L') : f.gf > f.ga ? 'W' : f.gf < f.ga ? 'L' : 'D';
  html += `<div class="card"><h2>Fixtures &amp; results</h2><div class="chips">${comps.map(([k, l]) => `<button class="chip ${UI.fixFilter === k ? 'on' : ''}" data-action="fixf" data-v="${k}">${l}</button>`).join('')}</div>
    ${table('fx', [{ k: 'n', l: '#', n: 1 }, { k: 'comp', l: 'Comp', f: f => COMP_SHORT[f.comp] }, { k: 'label', l: 'Round' }, { k: 'opp', l: 'Opponent', cls: 'name', f: f => esc(clubName(f.opp)) }, { k: 'venue', l: 'H/A' },
      { k: 'score', l: 'Score', f: f => `${f.gf}–${f.ga}${f.et ? ' aet' : ''}${f.pens ? ` (${f.pens[0]}–${f.pens[1]} p)` : ''}` }, { k: 'res', l: '', f: f => pill(res(f)) }, { k: 'sc', l: 'Our scorers', f: f => `<span class="muted">${esc(f.sc)}</span>` }], fx, { nosort: true })}</div>`;
  if (d.euroTable) {
    const et = d.euroTable.map((r, i) => ({ ...r, pos: i + 1, GD: r.GF - r.GA }));
    html += `<div class="card"><h2>${h.euro.name} league phase</h2>${table('et', tcols, et, { nosort: true, rowClass: r => (r.id === NU ? 'nu ' : '') + (r.pos <= 8 ? 'zone-uecl' : r.pos <= 24 ? 'zone-uel' : '') })}
      <div class="legend"><span><i style="background:var(--uecl)"></i>Round of 16</span><span><i style="background:var(--uel)"></i>Knockout play-off</span></div></div>`;
  }
  html += transferSummary(h.transfers, h.label);
  return html;
}
function awardsHtml(h) {
  const a = h.awards, div = DIV_NAME[h.div];
  const who = x => x ? (x.pid ? `<a href="#" data-action="player" data-id="${x.pid}"><b>${esc(x.name)}</b></a>` : esc(x.name)) + (x.club && x.club !== myName() ? ` <span class="muted">(${esc(x.club)})</span>` : '') : '—';
  const items = [
    [`${div} Golden Boot`, a.goldenBoot ? `${who(a.goldenBoot)} · ${a.goldenBoot.goals} goals` : '—', a.goldenBoot && a.goldenBoot.pid],
    [`${div} Player of the Season`, who(a.pots), a.pots && a.pots.pid],
    [`${div} Young Player`, who(a.ypots), a.ypots && a.ypots.pid],
    ['Club Player of the Season', who(a.clubPots)],
    ['Club Young Player', who(a.clubYoung)],
    ['Club top scorer', a.topScorer ? `${who(a.topScorer)} · ${a.topScorer.n}` : '—'],

function careerTotals(p) {
  const rows = p.seasons.filter(r => r.club === NU);
  const t = rows.reduce((a, r) => { a.apps += r.apps; a.goals += r.goals; a.assists += r.assists; a.yc += r.yc; a.rc += r.rc; a.potm += r.potm; a.mins += r.mins; if (r.avg) { a.rs += r.avg * r.apps; a.ra += r.apps; } return a; }, { apps: 0, goals: 0, assists: 0, yc: 0, rc: 0, potm: 0, mins: 0, rs: 0, ra: 0 });
  t.seasons = rows.length; t.avg = t.ra ? round1(t.rs / t.ra) : null;
  return t;
}
function joinedText(p) {
  const j = p.joined; if (!j) return '';
  if (j.how === 'Founding squad') return `In squad, summer ${j.season}`;
  if (j.how === 'Academy') return `Academy, ${j.season}`;
  if (j.how === 'Free transfer') return `Free${j.club ? ` from ${clubName(j.club)}` : ' agent'}, ${j.season}`;
